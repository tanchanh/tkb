<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thời Khoá Biểu - Dương Tấn Chánh</title>
  <style>
    /* ==========================================================================
       1. RESET & BOX-SIZING
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ==========================================================================
       2. BẢNG MÀU CHUẨN (11 MÃ MÀU QUY CHUẨN TẠI :ROOT)
       ========================================================================== */
    :root {
      --c-blue: #0066B6;
      --c-purple: #4020D0;
      --c-lime: #7FDD0F;
      --c-green: #009911;
      --c-orange: #EE6000;
      --c-red: #FF2040;
      --c-black: #000000;
      --c-dark-1: #1A1A1A;
      --c-dark-2: #262626;
      --c-gray: #CCCCCC;
      --c-white: #FFFFFF;
      --font-stack: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* ==========================================================================
       3. BỐ CỤC CHUNG & TYPOGRAPHY (FONT BODY: 1.2REM)
       ========================================================================== */
    body {
      font-family: var(--font-stack);
      font-size: 1.2rem;
      font-weight: normal;
      color: var(--c-white);
      background-color: var(--c-black);
      padding: 0.5rem;
      padding-bottom: 5rem;
      word-break: normal;
      overflow-wrap: break-word;
      line-height: 1.45;
      -webkit-text-size-adjust: 100%;
    }

    body.scroll-locked {
      overflow: hidden;
      touch-action: none;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: bold;
      text-align: center;
      color: var(--c-white);
      margin-top: 0.1rem;
      margin-bottom: 0.1rem;
    }

    .author-signature {
      font-size: 1.2rem;
      font-weight: normal;
      text-align: right;
      color: var(--c-gray);
      margin-bottom: 0.4rem;
    }

    h2 {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--c-white);
    }

    h3 {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--c-white);
    }

    h4, h5 {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--c-white);
    }

    :focus-visible {
      outline: 2px solid var(--c-lime);
      outline-offset: 2px;
    }

    /* ==========================================================================
       TỐI ƯU MÀN HÌNH LỚN: GIỚI HẠN 36REM (~576PX) CĂN GIỮA NHỎ GỌN
       ========================================================================== */
    @media (min-width: 600px) {
      h1,
      .author-signature,
      .top-controls-container,
      .date-strip,
      .days-tab-bar,
      .periods-list,
      .day-note-box {
        max-width: 36rem;
        margin-left: auto;
        margin-right: auto;
      }
    }

    /* ==========================================================================
       4. THANH CÔNG CỤ TRÊN CÙNG (BỐ CỤC 2 DÒNG THÔNG THOÁNG)
       ========================================================================== */
    .top-controls-container {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      margin-bottom: 0.45rem;
      width: 100%;
    }

    .top-row-user {
      display: flex;
      align-items: center;
      width: 100%;
    }

    .user-selector-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .btn-user-select {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 0.45rem 0.75rem;
      border-radius: 0.4rem;
      border: 2px solid var(--c-blue);
      background-color: var(--c-dark-1);
      color: var(--c-white);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      touch-action: manipulation;
      transition: transform 0.08s ease;
      max-width: 100%;
    }

    .btn-user-select:active {
      transform: scale(0.96);
    }

    /* Logo học sinh: Mẫu 1 (Thanh lịch), nền xanh lá bo góc 15% */
    .avatar-squircle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.8rem;
      height: 1.8rem;
      background-color: var(--c-green);
      border-radius: 15%;
      flex-shrink: 0;
      padding: 0.2rem;
    }

    .avatar-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Tên học sinh: Cách logo đúng 1 khoảng trắng (0.35rem) và cách mũi tên 0.5rem */
    .btn-user-name-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-left: 0.35rem;
      margin-right: 0.5rem;
    }

    .user-dropdown-arrow {
      font-size: 0.85rem;
      color: var(--c-gray);
      flex-shrink: 0;
      line-height: 1;
    }

    .user-dropdown-menu {
      position: absolute;
      top: calc(100% + 0.35rem);
      left: 0;
      width: 17.5rem;
      max-width: 90vw;
      background-color: var(--c-dark-1);
      border: 2px solid var(--c-blue);
      border-radius: 0.5rem;
      padding: 0.5rem;
      z-index: 1000;
      display: none;
      flex-direction: column;
      gap: 0.4rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.9);
    }

    .user-dropdown-menu.open {
      display: flex;
    }

    /* DANH SÁCH HỌC SINH NỚI RỘNG RÃI */
    .user-list-scroll {
      max-height: 16rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      padding: 0.2rem 0;
    }

    .user-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 0.8rem;
      min-height: 3.3rem;
      background-color: var(--c-dark-2);
      border: 2px solid transparent;
      border-radius: 0.45rem;
      cursor: pointer;
      gap: 0.6rem;
      user-select: none;
    }

    .user-item-row.active {
      border-color: var(--c-lime);
      background-color: var(--c-black);
    }

    .user-item-title {
      flex: 1 1 auto;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: bold;
      font-size: 1.2rem;
      color: var(--c-white);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      pointer-events: none;
    }

    .user-item-check {
      color: var(--c-lime);
      font-weight: bold;
    }

    .btn-user-gear {
      flex: 0 0 auto;
      min-width: 2.5rem;
      min-height: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--c-dark-1);
      border: 2px solid var(--c-gray);
      border-radius: 0.35rem;
      color: var(--c-white);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0;
      touch-action: manipulation;
    }

    /* Nút "Thêm học sinh" logo squircle 15% */
    .btn-create-user {
      width: 100%;
      padding: 0.55rem 0.6rem;
      background-color: var(--c-blue);
      border: 2px solid var(--c-blue);
      color: var(--c-white);
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 0.4rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 0.25rem;
      touch-action: manipulation;
    }

    .plus-squircle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.8rem;
      height: 1.8rem;
      background-color: var(--c-green);
      border-radius: 15%;
      flex-shrink: 0;
      padding: 0.25rem;
    }

    .plus-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Dòng 2: Nút thao tác Sửa & Dữ Liệu Mẫu */
    .top-row-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.4rem;
      width: 100%;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 0.45rem 0.95rem;
      border-radius: 0.4rem;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      touch-action: manipulation;
      transition: transform 0.08s ease;
      will-change: transform;
    }

    .btn-action:active {
      transform: scale(0.96);
    }

    .btn-action.btn-edit {
      background-color: var(--c-orange);
      border: 2px solid var(--c-orange);
      color: var(--c-white);
    }

    .btn-action.btn-done {
      background-color: var(--c-green);
      border: 2px solid var(--c-green);
      color: var(--c-white);
    }

    /* Ở chế độ Xem: Ẩn nút Dữ Liệu Mẫu */
    .btn-action.btn-sample-data {
      display: none;
      background-color: var(--c-dark-1);
      border: 2px solid var(--c-blue);
      color: var(--c-white);
    }

    /* Khi ở chế độ Sửa (edit-mode-active): Hiện nút Dữ Liệu Mẫu bên trái nút Xong */
    .edit-mode-active .btn-action.btn-sample-data {
      display: inline-flex;
    }

    /* ==========================================================================
       5. BỘ CHỌN THỜI GIAN: NGÀY HỆ THỐNG TỰ ĐỘNG, ÔM SÁT NHAU VÀ CĂN GIỮA
       ========================================================================== */
    .date-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.35rem 0.65rem;
      padding: 0.55rem 0.7rem;
      background-color: var(--c-dark-1);
      border: 2px solid var(--c-dark-2);
      border-radius: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .date-live-text {
      font-weight: bold;
      color: var(--c-lime);
      font-size: 1.2rem;
      white-space: nowrap;
    }

    .date-unit {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }

    .date-label {
      font-weight: bold;
      color: var(--c-lime);
      font-size: 1.2rem;
      user-select: none;
    }

    .date-bullet {
      font-weight: bold;
      color: var(--c-lime);
      user-select: none;
      font-size: 1.2rem;
    }

    @media (max-width: 440px) {
      .date-bullet {
        display: none;
      }
    }

    .date-val {
      display: inline-block;
      padding: 0.15rem 0.35rem;
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--c-white);
      border: 2px solid transparent;
      border-radius: 0.35rem;
      text-align: center;
      white-space: nowrap;
      min-width: 2.2rem;
    }

    .date-val:empty::before {
      content: attr(placeholder);
      color: var(--c-gray);
      opacity: 0.4;
    }

    .edit-mode-active .date-val {
      border: 2px solid var(--c-blue);
      background-color: var(--c-black);
      outline: none;
    }

    /* ==========================================================================
       6. THANH ĐIỀU HƯỚNG THỨ
       ========================================================================== */
    .days-tab-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.4rem;
      margin-bottom: 0.6rem;
    }

    .day-tab-btn {
      flex: 0 0 auto;
      min-width: 5.4rem;
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 0.45rem 0.4rem;
      border: 2px solid var(--c-gray);
      background-color: var(--c-dark-1);
      color: var(--c-white);
      border-radius: 0.4rem;
      cursor: pointer;
      text-align: center;
      user-select: none;
      white-space: nowrap;
      touch-action: manipulation;
      transition: transform 0.08s ease;
      will-change: transform;
    }

    .day-tab-btn:active {
      transform: scale(0.96);
    }

    .day-tab-btn.active-tab {
      background-color: var(--c-blue);
      border-color: var(--c-white);
      color: var(--c-white);
    }

    /* ==========================================================================
       7. DANH SÁCH TIẾT HỌC (NỀN DÂNG TIẾN TRÌNH THEO THỜI GIAN THỰC)
       ========================================================================== */
    .periods-list {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      margin-bottom: 0.8rem;
    }

    .period-card {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.55rem 0.75rem;
      border: 2px solid var(--c-dark-2);
      background-color: var(--c-dark-1);
      border-left: 6px solid var(--c-blue);
      border-radius: 0.5rem;
      min-height: 4.0rem;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    /* LỚP NỀN DÂNG NGANG THEO TIẾN ĐỘ THỜI GIAN THỰC (Z-INDEX: 0) */
    .period-progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 0%;
      background-color: rgba(0, 153, 17, 0.28);
      pointer-events: none;
      z-index: 0;
      transition: width 0.8s ease;
    }

    .period-card.period-active {
      border-color: var(--c-green);
      border-left: 6px solid var(--c-lime);
    }

    /* Cột bên trái: Xếp dọc 2 dòng tự nhiên (Z-INDEX: 1 nổi trên nền dâng) */
    .period-meta {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 0.15rem;
      flex: 1 1 auto;
      min-width: 0;
    }

    /* Dòng trên: Tên tiết (khóa chống ngắt dòng tuyệt đối) */
    .p-name {
      font-weight: bold;
      font-size: 1.2rem;
      color: var(--c-white);
      white-space: nowrap;
      line-height: 1.25;
      transition: color 0.2s ease;
    }

    /* Tiết đang học: Tên tiết phát sáng màu xanh lá mạ rực rỡ */
    .period-card.period-active .p-name {
      color: var(--c-lime);
    }

    /* Dòng dưới: Giờ học ngay ngắn */
    .p-time {
      font-size: 1.2rem;
      color: var(--c-gray);
      font-weight: normal;
      white-space: nowrap;
      line-height: 1.25;
    }

    .period-card.period-active .p-time {
      color: var(--c-white);
      font-weight: bold;
    }

    /* Nút môn học bên phải (Z-INDEX: 1) */
    .subject-badge {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 6.2rem;
      max-width: 9.5rem;
      padding: 0.45rem 0.6rem;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 0.4rem;
      user-select: none;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
      touch-action: manipulation;
      transition: transform 0.08s ease;
      will-change: transform;
    }

    .edit-mode-active .subject-badge {
      cursor: pointer;
      outline: 2px dashed var(--c-orange);
      outline-offset: 2px;
    }

    .edit-mode-active .subject-badge:active {
      transform: scale(0.95);
    }

    /* ==========================================================================
       THẺ "GIẢI LAO" ĐỒNG BỘ 100% CẤU TRÚC 2 TẦNG + NỀN DÂNG TIẾN ĐỘ
       ========================================================================== */
    .break-mini-card {
      position: relative;
      overflow: hidden;
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 0.55rem 0.75rem;
      border: 2px solid var(--c-orange);
      background-color: var(--c-dark-1);
      border-left: 6px solid var(--c-orange);
      border-radius: 0.5rem;
      min-height: 4.0rem;
      margin: -0.1rem 0;
      transition: background-color 0.2s ease;
    }

    /* KHI ĐẾN GIỜ RA CHƠI: HIỆN LÊN ĐỒNG BỘ */
    .break-mini-card.active-break {
      display: flex;
    }

    /* Lớp nền dâng màu cam ấm theo thời gian thực giải lao */
    .break-progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 0%;
      background-color: rgba(238, 96, 0, 0.28);
      pointer-events: none;
      z-index: 0;
      transition: width 0.8s ease;
    }

    .break-meta {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 0.15rem;
      flex: 1 1 auto;
      min-width: 0;
    }

    .break-title-text {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--c-orange);
      white-space: nowrap;
      line-height: 1.25;
    }

    .break-time-text {
      font-size: 1.2rem;
      color: var(--c-white);
      font-weight: normal;
      white-space: nowrap;
      line-height: 1.25;
    }

    /* NÚT ĐẾM NGƯỢC: MÀU CAM ĐẶC, KHÔNG VIỀN, CHỮ TRẮNG ĐỒNG BỘ VỚI MÔN HỌC */
    .break-countdown-badge {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 6.2rem;
      max-width: 9.5rem;
      padding: 0.45rem 0.6rem;
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--c-white);
      background-color: var(--c-orange);
      border: 2px solid var(--c-orange);
      border-radius: 0.4rem;
      user-select: none;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
    }

    /* ==========================================================================
       8. PHỐI MÀU MÔN HỌC (NÚT TRỐNG NỀN XÁM SÁNG CHỮ ĐEN)
       ========================================================================== */
    .sub-default {
      background-color: var(--c-green);
      color: var(--c-white);
      border: 2px solid var(--c-green);
    }

    .sub-shl {
      background-color: var(--c-purple);
      color: var(--c-white);
      border: 2px solid var(--c-purple);
    }

    .sub-gdtc {
      background-color: var(--c-orange);
      color: var(--c-white);
      border: 2px solid var(--c-orange);
    }

    .sub-empty {
      background-color: var(--c-gray);
      color: var(--c-black);
      border: 2px solid var(--c-gray);
      font-weight: bold;
    }

    /* ==========================================================================
       9. GHI CHÚ THEO THỨ (CÓ GỢI Ý MỜ THÔNG MINH)
       ========================================================================== */
    .day-note-box {
      border: 2px solid var(--c-dark-2);
      background-color: var(--c-dark-1);
      border-radius: 0.5rem;
      padding: 0.5rem;
      margin-bottom: 1rem;
    }

    .day-note-box h2 {
      margin-bottom: 0.4rem;
    }

    .day-note-textarea {
      width: 100%;
      min-height: 13.5rem;
      font-family: inherit;
      font-size: 1.2rem;
      line-height: 1.45;
      padding: 0.55rem;
      border: 2px solid var(--c-dark-2);
      background-color: var(--c-black);
      border-radius: 0.4rem;
      color: var(--c-white);
      outline: none;
      resize: none;
      scroll-margin-bottom: 5rem;
    }

    .day-note-textarea::placeholder {
      color: var(--c-gray);
      opacity: 0.45;
    }

    .day-note-textarea:read-only {
      border: 2px dashed var(--c-dark-2);
    }

    .edit-mode-active .day-note-textarea {
      border: 2px solid var(--c-blue);
    }

    /* ==========================================================================
       10. HỘP THOẠI CHỌN MÔN (CENTERED MODAL)
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 0.25rem;
      touch-action: none;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .picker-sheet {
      width: 98%;
      max-width: 26rem;
      background-color: var(--c-dark-1);
      border: 2px solid var(--c-blue);
      border-radius: 0.6rem;
      padding: 0.45rem 0.5rem;
      max-height: 85vh;
      max-height: 85dvh;
      overflow-y: auto;
      touch-action: pan-y;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
    }

    .picker-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.35rem;
      border-bottom: 2px solid var(--c-dark-2);
      margin-bottom: 0.45rem;
    }

    .sheet-title-text {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--c-white);
    }

    .btn-close-sheet {
      background: none;
      border: none;
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--c-gray);
      cursor: pointer;
      padding: 0 0.3rem;
      touch-action: manipulation;
    }

    .custom-subject-bar {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      width: 100%;
      margin-bottom: 0.5rem;
    }

    .custom-subject-input {
      flex: 1 1 0;
      min-width: 0;
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 0.35rem 0.45rem;
      border-radius: 0.4rem;
      border: 2px solid var(--c-dark-2);
      background-color: var(--c-black);
      color: var(--c-white);
      outline: none;
      text-transform: uppercase;
    }

    .custom-subject-input:focus {
      border-color: var(--c-blue);
    }

    .btn-add-sub {
      flex: 0 0 auto;
      white-space: nowrap;
      background-color: var(--c-blue);
      border: 2px solid var(--c-blue);
      color: var(--c-white);
      padding: 0.35rem 0.85rem;
      font-size: 1.2rem;
    }

    .picker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(5.8rem, 1fr));
      gap: 0.5rem;
      padding: 0.4rem 0.25rem;
      margin-bottom: 0.5rem;
    }

    .custom-sub-item-wrap {
      position: relative;
      display: flex;
      width: 100%;
    }

    .btn-subject-item {
      width: 100%;
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 0.5rem 0.2rem;
      border-radius: 0.4rem;
      border: 2px solid transparent;
      cursor: pointer;
      text-align: center;
      user-select: none;
      touch-action: manipulation;
      transition: transform 0.08s ease;
      will-change: transform;
    }

    .btn-subject-item:active {
      transform: scale(0.95);
    }

    .btn-del-sub-badge {
      position: absolute;
      top: -0.35rem;
      right: -0.35rem;
      width: 1.4rem;
      height: 1.4rem;
      background-color: var(--c-red);
      border: 2px solid var(--c-black);
      border-radius: 50%;
      color: var(--c-white);
      font-size: 1.0rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 3;
      padding: 0;
      line-height: 1;
      touch-action: manipulation;
    }

    .btn-sheet-cancel-btn {
      width: 100%;
      padding: 0.45rem;
      background-color: var(--c-dark-2);
      border: 2px solid var(--c-gray);
      color: var(--c-white);
      font-size: 1.2rem;
    }

    /* ==========================================================================
       11. HỘP THOẠI NHẬP TÊN HỌC SINH (THÊM MỚI / ĐỔI TÊN)
       ========================================================================== */
    #modal-name-prompt {
      z-index: 10000;
    }

    .prompt-box {
      width: 92%;
      max-width: 23rem;
      background-color: var(--c-dark-1);
      border: 2px solid var(--c-blue);
      border-radius: 0.7rem;
      padding: 1.2rem 1.0rem;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .prompt-title {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--c-white);
      text-align: center;
    }

    .prompt-input {
      width: 100%;
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 0.55rem 0.65rem;
      border-radius: 0.4rem;
      border: 2px solid var(--c-dark-2);
      background-color: var(--c-black);
      color: var(--c-white);
      outline: none;
    }

    .prompt-input:focus {
      border-color: var(--c-blue);
    }

    .prompt-input::placeholder {
      color: var(--c-gray);
      opacity: 0.4;
    }

    .prompt-error {
      color: var(--c-orange);
      font-size: 1.1rem;
      font-weight: bold;
      min-height: 1.4rem;
      text-align: center;
    }

    .prompt-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.85rem;
    }

    /* ==========================================================================
       12. HỘP THOẠI CẤU HÌNH HỌC SINH (⚙️ DÃN CÁCH RỘNG RÃI)
       ========================================================================== */
    #modal-student-actions {
      z-index: 10000;
    }

    .student-actions-box {
      width: 90%;
      max-width: 22rem;
      background-color: var(--c-dark-1);
      border: 2px solid var(--c-blue);
      border-radius: 0.7rem;
      padding: 1.2rem 1.0rem;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .student-actions-title {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--c-white);
      text-align: center;
      padding-bottom: 0.6rem;
      border-bottom: 2px solid var(--c-dark-2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 0.2rem;
    }

    .btn-student-act {
      width: 100%;
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 0.75rem 1.0rem;
      min-height: 3.2rem;
      border-radius: 0.45rem;
      cursor: pointer;
      text-align: center;
      border: 2px solid transparent;
      touch-action: manipulation;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-student-rename {
      background-color: var(--c-blue);
      border-color: var(--c-blue);
      color: var(--c-white);
    }

    .btn-student-delete {
      background-color: var(--c-dark-1);
      border-color: var(--c-red);
      color: var(--c-red);
      margin-bottom: 0.3rem;
    }

    .btn-student-cancel-act {
      background-color: var(--c-dark-2);
      border-color: var(--c-gray);
      color: var(--c-white);
    }

    /* ==========================================================================
       13. POPUP XÁC NHẬN NỘI BỘ (Z-INDEX 10001 NỔI TRÊN CÙNG)
       ========================================================================== */
    #modal-confirm {
      z-index: 10001;
    }

    .confirm-box {
      width: 92%;
      max-width: 24rem;
      background-color: var(--c-dark-1);
      border: 2px solid var(--c-orange);
      border-radius: 0.6rem;
      padding: 1.0rem;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.9);
      text-align: center;
    }

    .confirm-title {
      color: var(--c-orange);
      margin-bottom: 0.6rem;
    }

    .confirm-msg {
      font-size: 1.2rem;
      color: var(--c-white);
      line-height: 1.5;
      margin-bottom: 1.2rem;
      text-align: left;
    }

    .confirm-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.85rem;
    }

    .btn-confirm-cancel {
      background-color: var(--c-dark-2);
      border: 2px solid var(--c-gray);
      color: var(--c-white);
    }

    .btn-confirm-ok {
      background-color: var(--c-blue);
      border: 2px solid var(--c-blue);
      color: var(--c-white);
    }

    .btn-confirm-danger {
      background-color: var(--c-red);
      border: 2px solid var(--c-red);
      color: var(--c-white);
    }
  </style>
</head>
<body>

  <!-- TIÊU ĐỀ & TÁC GIẢ -->
  <h1>THỜI KHOÁ BIỂU</h1>
  <div class="author-signature">Dương Tấn Chánh</div>

  <!-- THANH CÔNG CỤ: TÁCH 2 DÒNG THÔNG THOÁNG -->
  <div class="top-controls-container">
    <!-- Dòng 1: Nút tên học sinh -->
    <div class="top-row-user">
      <div class="user-selector-wrap">
        <button type="button" class="btn-user-select" id="btn-user-toggle" aria-haspopup="true" aria-expanded="false">
          <span class="avatar-squircle">
            <svg class="avatar-svg" viewBox="0 0 36 36">
              <circle cx="18" cy="12" r="5" fill="#FFFFFF"/>
              <path d="M 8 30 C 8 23.5, 12 20.5, 18 20.5 C 24 20.5, 28 23.5, 28 30 Z" fill="#FFFFFF"/>
            </svg>
          </span>
          <span class="btn-user-name-text" id="lbl-active-user-name">Học Sinh 1</span>
          <span class="user-dropdown-arrow">▼</span>
        </button>

        <!-- Menu danh sách học sinh -->
        <div class="user-dropdown-menu" id="user-dropdown">
          <div class="user-list-scroll" id="user-list-container"></div>
          <button type="button" class="btn-create-user" id="btn-create-user-trigger">
            <span class="plus-squircle">
              <svg class="plus-svg" viewBox="0 0 20 20">
                <path d="M 10 4 L 10 16 M 4 10 L 16 10" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
              </svg>
            </span>
            <span>Thêm học sinh</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Dòng 2: Cụm nút thao tác (Chỉ hiện "Sửa" khi xem; Hiện "Dữ Liệu Mẫu" + "Xong" khi sửa) -->
    <div class="top-row-actions">
      <button type="button" class="btn-action btn-sample-data" id="btn-reset">Dữ Liệu Mẫu</button>
      <button type="button" class="btn-action btn-edit" id="btn-edit-toggle">Sửa</button>
    </div>
  </div>

  <!-- THÁNG / NĂM / GIỜ VÀO HỌC (NGÀY HỆ THỐNG TỰ ĐỘNG, CANH GIỮA, GẦN NHAU) -->
  <div class="date-strip">
    <span class="date-live-text" id="lbl-live-date">Thứ Ba, 17/09/2024</span>
    <span class="date-bullet">•</span>
    <div class="date-unit">
      <span class="date-label">Vào học</span>
      <span id="val-start-time" class="date-val" inputmode="numeric">12:30</span>
    </div>
  </div>

  <!-- CÁC NÚT THỨ: CANH GIỮA -->
  <div class="days-tab-bar" role="tablist">
    <button type="button" class="day-tab-btn" id="tab-btn-2" data-day="2" role="tab" aria-controls="list-periods">Thứ 2</button>
    <button type="button" class="day-tab-btn" id="tab-btn-3" data-day="3" role="tab" aria-controls="list-periods">Thứ 3</button>
    <button type="button" class="day-tab-btn" id="tab-btn-4" data-day="4" role="tab" aria-controls="list-periods">Thứ 4</button>
    <button type="button" class="day-tab-btn" id="tab-btn-5" data-day="5" role="tab" aria-controls="list-periods">Thứ 5</button>
    <button type="button" class="day-tab-btn" id="tab-btn-6" data-day="6" role="tab" aria-controls="list-periods">Thứ 6</button>
    <button type="button" class="day-tab-btn" id="tab-btn-7" data-day="7" role="tab" aria-controls="list-periods">Thứ 7</button>
  </div>

  <!-- DANH SÁCH 5 TIẾT CHIỀU & THẺ GIẢI LAO ĐỒNG BỘ -->
  <div class="periods-list" id="list-periods"></div>

  <!-- GHI CHÚ THEO TỪNG THỨ (CÓ GỢI Ý MỜ THÔNG MINH) -->
  <div class="day-note-box">
    <h2 id="day-note-heading">Ghi chú Thứ Hai</h2>
    <textarea class="day-note-textarea" id="txt-day-note" maxlength="5000" readonly></textarea>
  </div>

  <!-- HỘP THOẠI CHỌN MÔN (CENTERED MODAL) -->
  <div class="modal-backdrop" id="modal-picker" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="picker-sheet">
      <div class="picker-header">
        <h3 class="sheet-title-text" id="sheet-title">Chọn môn</h3>
        <button type="button" class="btn-close-sheet" id="btn-sheet-close" aria-label="Đóng">&times;</button>
      </div>

      <!-- Ô nhập "Thêm môn học" và nút "Thêm" ngắn gọn, dứt khoát -->
      <div class="custom-subject-bar">
        <input type="text" id="inp-custom-subject" class="custom-subject-input" placeholder="Thêm môn học" maxlength="15">
        <button type="button" id="btn-add-custom-subject" class="btn-action btn-add-sub">Thêm</button>
      </div>

      <div class="picker-grid" id="sheet-grid"></div>

      <button type="button" class="btn-action btn-sheet-cancel-btn" id="btn-sheet-cancel">
        Đóng
      </button>
    </div>
  </div>

  <!-- HỘP THOẠI NHẬP TÊN HỌC SINH (THÊM MỚI / ĐỔI TÊN) -->
  <div class="modal-backdrop" id="modal-name-prompt" role="dialog" aria-modal="true">
    <div class="prompt-box">
      <h3 class="prompt-title" id="prompt-dialog-title">Thêm Học Sinh Mới</h3>
      <input type="text" id="inp-student-name" class="prompt-input" maxlength="15" placeholder="Học Sinh 1">
      <div class="prompt-error" id="prompt-error-msg"></div>
      <div class="prompt-actions">
        <button type="button" class="btn-action btn-confirm-cancel" id="btn-prompt-cancel">Hủy</button>
        <button type="button" class="btn-action btn-confirm-ok" id="btn-prompt-save">Lưu</button>
      </div>
    </div>
  </div>

  <!-- HỘP THOẠI CẤU HÌNH HỌC SINH (⚙️ DÃN CÁCH RỘNG RÃI) -->
  <div class="modal-backdrop" id="modal-student-actions" role="dialog" aria-modal="true">
    <div class="student-actions-box">
      <div class="student-actions-title" id="student-actions-target-name">Học Sinh 1</div>
      <button type="button" class="btn-student-act btn-student-rename" id="btn-act-rename">✏️ Đổi Tên</button>
      <button type="button" class="btn-student-act btn-student-delete" id="btn-act-delete">🗑️ Xoá Học Sinh</button>
      <button type="button" class="btn-student-act btn-student-cancel-act" id="btn-act-cancel">Đóng</button>
    </div>
  </div>

  <!-- POPUP XÁC NHẬN NỘI BỘ -->
  <div class="modal-backdrop" id="modal-confirm" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="confirm-box">
      <h3 class="confirm-title" id="confirm-title">Xác Nhận</h3>
      <p class="confirm-msg" id="confirm-msg"></p>
      <div class="confirm-actions">
        <button type="button" class="btn-action btn-confirm-cancel" id="btn-confirm-cancel">Hủy</button>
        <button type="button" class="btn-action btn-confirm-ok" id="btn-confirm-ok">Đồng Ý</button>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT XỬ LÝ TOÀN BỘ LOGIC HỆ THỐNG ĐÃ DỌN SẠCH 100% MÃ THỪA -->
  <script>
    (function () {
      "use strict";

      const DEFAULT_BASE_SUBJECTS = [
        "TOÁN", "VĂN", "ANH", "KH TN", "TIN", "SỬ", "ĐỊA", "GD TC",
        "C.NGHỆ", "GD CD", "GD ĐP", "NHẠC", "VẼ", "HĐ TN", "S H L"
      ];

      const SAMPLE_TIMETABLE = {
        "2": ["TIN", "GD TC", "ANH", "HĐ TN", "HĐ TN"],
        "3": ["TOÁN", "TOÁN", "VĂN", "KH TN", "ĐỊA"],
        "4": ["NHẠC", "GD TC", "GD CD", "C.NGHỆ", "TOÁN"],
        "5": ["VẼ", "ANH", "GD ĐP", "VĂN", "SỬ"],
        "6": ["TOÁN", "VĂN", "VĂN", "KH TN", "KH TN"],
        "7": ["SỬ", "KH TN", "HĐ TN", "C.NGHỆ", "ANH"]
      };

      // CHUẨN HOÁ DỮ LIỆU HỒ SƠ HỌC SINH (SẠCH SẼ, KHÔNG CÒN MÃ THỪA THÁNG NĂM CŨ)
      function normalizeStudentProfile(std) {
        if (!std || typeof std !== "object") return createDefaultStudentProfile();
        if (typeof std.name !== "string" || !std.name.trim()) std.name = "Học Sinh 1";
        if (typeof std.gioVaoHoc !== "string") std.gioVaoHoc = "12:30";

        if (!std.monHoc || typeof std.monHoc !== "object") {
          std.monHoc = JSON.parse(JSON.stringify(SAMPLE_TIMETABLE));
        }

        for (let d = 2; d <= 7; d++) {
          const key = String(d);
          if (!Array.isArray(std.monHoc[key])) {
            std.monHoc[key] = SAMPLE_TIMETABLE[key] || ["TRỐNG", "TRỐNG", "TRỐNG", "TRỐNG", "TRỐNG"];
          } else {
            for (let i = 0; i < 5; i++) {
              const item = std.monHoc[key][i];
              if (typeof item === "string") {
                std.monHoc[key][i] = item.trim() || "TRỐNG";
              } else if (item && typeof item === "object" && item.mon) {
                std.monHoc[key][i] = String(item.mon).trim() || "TRỐNG";
              } else {
                std.monHoc[key][i] = "TRỐNG";
              }
            }
          }
        }

        if (!Array.isArray(std.monHocList) || std.monHocList.length === 0) {
          std.monHocList = [...DEFAULT_BASE_SUBJECTS];
        } else {
          std.monHocList = std.monHocList.map(item => {
            return typeof item === "string" ? item.trim() : (item && item.mon ? String(item.mon).trim() : "");
          }).filter(Boolean);
        }

        if (!std.ghiChuTheoThu || typeof std.ghiChuTheoThu !== "object") {
          std.ghiChuTheoThu = { "2": "", "3": "", "4": "", "5": "", "6": "", "7": "" };
        }

        return std;
      }

      function createDefaultStudentProfile(id, name, isBlank = false) {
        const emptySchedule = {
          "2": ["TRỐNG", "TRỐNG", "TRỐNG", "TRỐNG", "TRỐNG"],
          "3": ["TRỐNG", "TRỐNG", "TRỐNG", "TRỐNG", "TRỐNG"],
          "4": ["TRỐNG", "TRỐNG", "TRỐNG", "TRỐNG", "TRỐNG"],
          "5": ["TRỐNG", "TRỐNG", "TRỐNG", "TRỐNG", "TRỐNG"],
          "6": ["TRỐNG", "TRỐNG", "TRỐNG", "TRỐNG", "TRỐNG"],
          "7": ["TRỐNG", "TRỐNG", "TRỐNG", "TRỐNG", "TRỐNG"]
        };

        return {
          id: id || ("std_" + Date.now()),
          name: name || "Học Sinh 1",
          gioVaoHoc: "12:30",
          monHoc: isBlank ? emptySchedule : JSON.parse(JSON.stringify(SAMPLE_TIMETABLE)),
          ghiChuTheoThu: { "2": "", "3": "", "4": "", "5": "", "6": "", "7": "" },
          monHocList: [...DEFAULT_BASE_SUBJECTS]
        };
      }

      const inMemoryStore = {};
      const SafeStorage = {
        getItem(key) {
          try {
            return localStorage.getItem(key);
          } catch (e) {
            return inMemoryStore[key] || null;
          }
        },
        setItem(key, val) {
          try {
            localStorage.setItem(key, val);
          } catch (e) {
            inMemoryStore[key] = String(val);
          }
        }
      };

      const KNOWN_STORAGE_KEYS = [
        "tkb_multi_user_app_v38_clean_master_final",
        "tkb_multi_user_app_v37_perfect_unified_date",
        "tkb_multi_user_app_v36_live_progress_and_breaks",
        "tkb_multi_user_app_v35_tier2_perfect",
        "tkb_multi_user_app_v34_lime_name_active",
        "tkb_multi_user_app_v33_live_period_active",
        "tkb_multi_user_app_v32_reset_edit_auto",
        "tkb_multi_user_app_v31_spacing_perfect",
        "tkb_multi_user_app_v30_edit_only_sample",
        "tkb_multi_user_app_v29_36rem_optimized",
        "tkb_multi_user_app_v28_desktop_optimized",
        "tkb_multi_user_app_v27_ultimate_fix",
        "tkb_multi_user_app_v26_master_zero_defect"
      ];
      const PRIMARY_STORAGE_KEY = KNOWN_STORAGE_KEYS[0];

      let rootData = loadRootData();
      let currentDay = getTodayIndex();
      let isEditMode = false;
      let editTargetIndex = null;
      let isToggling = false;

      let targetedStudentForAction = null;

      function loadRootData() {
        for (let i = 0; i < KNOWN_STORAGE_KEYS.length; i++) {
          try {
            const raw = SafeStorage.getItem(KNOWN_STORAGE_KEYS[i]);
            if (raw) {
              const parsed = JSON.parse(raw);
              if (parsed && typeof parsed === "object" && Array.isArray(parsed.students) && parsed.students.length > 0) {
                parsed.students = parsed.students.map(normalizeStudentProfile);
                if (!parsed.activeId || !parsed.students.some(s => s.id === parsed.activeId)) {
                  parsed.activeId = parsed.students[0].id;
                }
                return parsed;
              }
            }
          } catch (e) {
            console.warn("Lỗi đọc khoá lưu trữ:", KNOWN_STORAGE_KEYS[i], e);
          }
        }

        const initialStudent = createDefaultStudentProfile("std_default", "Học Sinh 1", false);
        return {
          activeId: initialStudent.id,
          students: [initialStudent]
        };
      }

      function getActiveStudent() {
        let std = rootData.students.find(s => s.id === rootData.activeId);
        if (!std) {
          std = rootData.students[0];
          rootData.activeId = std.id;
        }
        return normalizeStudentProfile(std);
      }

      function silentSave() {
        const std = getActiveStudent();
        if (isEditMode && txtDayNote) {
          if (!std.ghiChuTheoThu) std.ghiChuTheoThu = {};
          std.ghiChuTheoThu[String(currentDay)] = txtDayNote.value;
        }
        SafeStorage.setItem(PRIMARY_STORAGE_KEY, JSON.stringify(rootData));
      }

      let saveNoteTimer = null;
      function debouncedSaveNote() {
        clearTimeout(saveNoteTimer);
        saveNoteTimer = setTimeout(() => {
          silentSave();
        }, 300);
      }
      function flushSaveNote() {
        clearTimeout(saveNoteTimer);
        silentSave();
      }

      function parseTimeString(timeStr) {
        if (!timeStr) return { h: 12, m: 30 };
        let clean = String(timeStr).trim().replace(/[hH.\s]/g, ":");
        if (/^\d{3,4}$/.test(clean)) {
          if (clean.length === 3) {
            clean = clean.slice(0, 1) + ":" + clean.slice(1);
          } else {
            clean = clean.slice(0, 2) + ":" + clean.slice(2);
          }
        }
        let parts = clean.split(":");
        let h = parseInt(parts[0], 10);
        let m = parts.length > 1 ? parseInt(parts[1], 10) : 0;
        if (isNaN(h) || h < 0 || h > 23) h = 12;
        if (isNaN(m) || m < 0 || m > 59) m = 0;
        return { h, m };
      }

      function formatMinutesToTime(totalMins) {
        let h = Math.floor(totalMins / 60) % 24;
        let m = totalMins % 60;
        let mStr = m < 10 ? "0" + m : String(m);
        let displayH = h > 12 ? h - 12 : (h === 0 ? 12 : h);
        return displayH + ":" + mStr;
      }

      // HÀM ĐỊNH DẠNG NGÀY HỆ THỐNG: "Thứ ..., ../../...." (BỎ CHỮ " NGÀY")
      function getLiveDateFormatted() {
        const now = new Date();
        const dayIndex = now.getDay();
        const dayNames = ["Chủ Nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];
        const dayName = dayNames[dayIndex] || "Thứ Hai";
        const d = now.getDate();
        const m = now.getMonth() + 1;
        const y = now.getFullYear();
        const dStr = d < 10 ? "0" + d : String(d);
        const mStr = m < 10 ? "0" + m : String(m);
        return dayName + ", " + dStr + "/" + mStr + "/" + y;
      }

      function calculateTimeSlots(startTimeStr) {
        const { h, m } = parseTimeString(startTimeStr);
        let currentMin = h * 60 + m;
        const breaks = [5, 5, 15, 5];
        const slots = [];

        for (let i = 0; i < 5; i++) {
          let pStart = currentMin;
          let pEnd = pStart + 45;
          slots.push({
            label: "Tiết " + (i + 1),
            gio: formatMinutesToTime(pStart) + " - " + formatMinutesToTime(pEnd),
            startMin: pStart,
            endMin: pEnd
          });
          if (i < 4) {
            currentMin = pEnd + breaks[i];
          }
        }
        return slots;
      }

      function getTodayIndex() {
        const d = new Date().getDay();
        if (d >= 1 && d <= 6) return d + 1;
        return 2;
      }

        "4": "Thứ Tư",

      function getSubjectColorClass(name) {

          str = String(name.mon);
        }
        const clean = str.replace(/\s+/g, ' ').trim().toUpperCase();
        if (clean === "S H L" || clean.includes("S H L")) return "sub-shl";
        if (clean === "GD TC") return "sub-gdtc";
        if (clean === "TRỐNG" || clean === "") return "sub-empty";
        return "sub-default";
      }

      // TẠO 5 TIẾT HỌC BỐ CỤC 2 TẦNG + LỚP NỀN DÂNG TIẾN TRÌNH
      let activeStudent = getActiveStudent();
      let calculatedSlots = calculateTimeSlots(activeStudent.gioVaoHoc || "12:30");

      const periodCards = calculatedSlots.map((slot, index) => {

        card.appendChild(metaBox);

        return {
          card,
          progressFill,

            let nameStr = "TRỐNG";

      // TẠO 4 THẺ GIẢI LAO ĐỒNG BỘ 100% CẤU TRÚC VÀ NỀN DÂNG CAM
      const breakCards = [];
      for (let i = 0; i < 4; i++) {
        const bCard = document.createElement("div");
        bCard.className = "break-mini-card";

        // Lớp nền dâng màu cam ấm

        bCount.className = "break-countdown-badge";

      // ĐƯA TIẾT HỌC VÀ THẺ GIẢI LAO XEN KẼ VÀO MÀN HÌNH

      function updateCalculatedScheduleTimes(timeStr) {
        calculatedSlots = calculateTimeSlots(timeStr);
        for (let i = 0; i < 5; i++) {
          if (periodCards[i]) {
            periodCards[i].updateTime(calculatedSlots[i].gio);

      // ========================================================================
      // TỰ ĐỘNG CẬP NHẬT TIẾN TRÌNH TIẾT HỌC, GIỜ GIẢI LAO & NHẢY NGÀY XUYÊN ĐÊM
      // ========================================================================
      function updateLiveActivePeriod() {
        // Tự động cập nhật lại dòng ngày hệ thống nếu chạy xuyên đêm qua 00:00
        if (lblLiveDate) {
          lblLiveDate.textContent = getLiveDateFormatted();
        }

        const now = new Date();
        const realDay = now.getDay();
        const todayIndex = (realDay >= 1 && realDay <= 6) ? (realDay + 1) : 2;
        const isViewingToday = (currentDay === todayIndex && realDay !== 0);

        const currentTotalMins = now.getHours() * 60 + now.getMinutes();

        // 1. CẬP NHẬT 5 TIẾT HỌC (NỀN DÂNG XANH THEO TIẾN ĐỘ)
        for (let i = 0; i < 5; i++) {
          if (!periodCards[i]) continue;
          const slot = calculatedSlots[i];
          const isActive = isViewingToday && slot && (currentTotalMins >= slot.startMin && currentTotalMins < slot.endMin);

          periodCards[i].card.classList.toggle("period-active", isActive);

          if (isActive && slot) {
            const duration = slot.endMin - slot.startMin;
            const elapsed = currentTotalMins - slot.startMin;
            const pct = Math.min(100, Math.max(0, Math.round((elapsed / duration) * 100)));
            periodCards[i].progressFill.style.width = pct + "%";
          } else {
            periodCards[i].progressFill.style.width = "0%";
          }
        }

        // 2. CẬP NHẬT 4 THẺ GIẢI LAO (NỀN DÂNG CAM THEO TIẾN ĐỘ & NÚT CAM CHỮ TRẮNG)
        for (let i = 0; i < 4; i++) {
          if (!breakCards[i]) continue;
          const prevSlot = calculatedSlots[i];
          const nextSlot = calculatedSlots[i + 1];

          if (!prevSlot || !nextSlot) {
            breakCards[i].card.classList.remove("active-break");
            continue;
          }

          const breakStart = prevSlot.endMin;
          const breakEnd = nextSlot.startMin;
          const isBreakActive = isViewingToday && (currentTotalMins >= breakStart && currentTotalMins < breakEnd);

          breakCards[i].card.classList.toggle("active-break", isBreakActive);

          if (isBreakActive) {
            const duration = breakEnd - breakStart;
            const elapsed = currentTotalMins - breakStart;
            const pct = Math.min(100, Math.max(0, Math.round((elapsed / duration) * 100)));
            const remaining = breakEnd - currentTotalMins;

            breakCards[i].fill.style.width = pct + "%";
            breakCards[i].time.textContent = formatMinutesToTime(breakStart) + " - " + formatMinutesToTime(breakEnd);
            breakCards[i].count.textContent = "Còn " + remaining + "p";
          } else {
            breakCards[i].fill.style.width = "0%";
          }
        }
      }

      // ========================================================================
      // BẢNG CHỌN MÔN (NÚT TRỐNG NỀN XÁM SÁNG CHỮ ĐEN)
      // ========================================================================
      function buildPickerSheet() {
        sheetGrid.innerHTML = "";
        const std = getActiveStudent();
        const list = Array.isArray(std.monHocList) && std.monHocList.length > 0
          ? std.monHocList
          : DEFAULT_BASE_SUBJECTS;

        list.forEach(subItem => {
          let subName = typeof subItem === "string" ? subItem.trim() : (subItem && subItem.mon ? String(subItem.mon).trim() : "");
          if (!subName || subName === "TRỐNG") return;

          const wrap = document.createElement("div");
          wrap.className = "custom-sub-item-wrap";

          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "btn-subject-item " + getSubjectColorClass(subName);
          btn.textContent = subName;
          btn.dataset.subName = subName;

          const delBadge = document.createElement("button");
          delBadge.type = "button";
          delBadge.className = "btn-del-sub-badge";
          delBadge.textContent = "×";
          delBadge.title = "Xoá môn " + subName;
          delBadge.dataset.delName = subName;

          wrap.appendChild(btn);
          wrap.appendChild(delBadge);
          sheetGrid.appendChild(wrap);
        });

        const emptyBtn = document.createElement("button");
        emptyBtn.type = "button";
        emptyBtn.className = "btn-subject-item sub-empty";
        emptyBtn.textContent = "TRỐNG";
        emptyBtn.dataset.subName = "TRỐNG";
        sheetGrid.appendChild(emptyBtn);
      }

      sheetGrid.addEventListener("click", (e) => {
        const delBtn = e.target.closest(".btn-del-sub-badge");
        if (delBtn) {
          e.stopPropagation();
          const targetSub = delBtn.dataset.delName;
          if (targetSub) deleteSubjectFromStudent(targetSub);
          return;
        }

        const subBtn = e.target.closest(".btn-subject-item");
        if (subBtn) {
          const targetSub = subBtn.dataset.subName;
          if (targetSub) applySubject(targetSub);
        }
      });

      function openPicker(index, label) {
        editTargetIndex = index;
        sheetTitle.textContent = label + " - " + (DAY_NAMES[String(currentDay)] || "");
        inpCustomSubject.value = "";
        modalPicker.classList.add("open");
        document.body.classList.add("scroll-locked");

        try {
          history.pushState({ modalOpen: true }, "");
        } catch (e) {}

        btnSheetClose.focus();
      }

      function closePicker(shouldTriggerBack = true) {
        if (!modalPicker.classList.contains("open")) return;
        modalPicker.classList.remove("open");

        if (!hasAnyModalOpen()) {
          document.body.classList.remove("scroll-locked");
        }

        if (shouldTriggerBack && history.state && history.state.modalOpen) {
          try {
            history.back();
          } catch (e) {}
        }

        if (editTargetIndex !== null && periodCards[editTargetIndex]) {
          periodCards[editTargetIndex].badge.focus();
        }
        editTargetIndex = null;
      }

      function applySubject(name) {
        if (editTargetIndex !== null) {
          const std = getActiveStudent();
          const dayKey = String(currentDay);
          if (!std.monHoc[dayKey]) std.monHoc[dayKey] = [];
          std.monHoc[dayKey][editTargetIndex] = name;
          silentSave();

          periodCards[editTargetIndex].update(name);
        }
        closePicker(true);
      }

      function handleAddCustomSubject() {
        const val = inpCustomSubject.value.replace(/\s+/g, ' ').trim().toUpperCase();
        if (!val || val === "TRỐNG") {
          inpCustomSubject.value = "";
          return;
        }

        const std = getActiveStudent();
        if (!Array.isArray(std.monHocList)) std.monHocList = [...DEFAULT_BASE_SUBJECTS];
        if (!std.monHocList.includes(val)) {
          std.monHocList.push(val);
          silentSave();
          buildPickerSheet();
        }

        inpCustomSubject.value = "";
        applySubject(val);
      }

      btnAddCustomSubject.addEventListener("click", handleAddCustomSubject);
      inpCustomSubject.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          handleAddCustomSubject();
        }
      });

      async function deleteSubjectFromStudent(subjectToDelete) {
        const msg = "Bạn có chắc chắn muốn xoá môn \"" + subjectToDelete + "\" không?\n\nKhi xoá môn này, tất cả các tiết có môn \"" + subjectToDelete + "\" ở tất cả các Thứ của học sinh này sẽ chuyển về TRỐNG.";
        const agreed = await showCustomConfirm("Xác Nhận Xoá Môn", msg, true);
        if (agreed) {
          const std = getActiveStudent();
          if (Array.isArray(std.monHocList)) {
            std.monHocList = std.monHocList.filter(item => item !== subjectToDelete);
          }

          for (let d = 2; d <= 7; d++) {
            const key = String(d);
            if (Array.isArray(std.monHoc[key])) {
              for (let i = 0; i < 5; i++) {
                if (std.monHoc[key][i] === subjectToDelete) {
                  std.monHoc[key][i] = "TRỐNG";
                }
              }
            }
          }

          silentSave();
          buildPickerSheet();
          render();
        }
      }

      // ========================================================================
      // QUẢN LÝ MENU HỌC SINH (CHẠM CẢ HÀNG ĐỂ ĐỔI NGƯỜI DÙNG)
      // ========================================================================
      function renderUserDropdownList() {
        userListContainer.innerHTML = "";
        rootData.students.forEach(std => {
          const row = document.createElement("div");
          row.className = "user-item-row" + (std.id === rootData.activeId ? " active" : "");

      function switchActiveStudent(newStudentId, enterEditModeNow = false) {

      btnActDelete.addEventListener("click", async () => {

          : "Bạn có chắc chắn muốn xoá học sinh \"" + std.name + "\" không?\n\nToàn bộ thời khoá biểu của học sinh này sẽ bị xoá vĩnh viễn.";

      // ========================================================================

      function handleSaveNamePrompt() {
        let typed = inpStudentName.value.replace(/\s+/g, ' ').trim();
        const placeholderName = inpStudentName.placeholder || getNextDefaultStudentName();

        if (!typed) {
          typed = placeholderName;
        }

        const isDuplicate = rootData.students.some(s => {
          if (promptMode === "rename" && promptTargetStudent && s.id === promptTargetStudent.id) {
            return false;
          }
          return s.name.toUpperCase() === typed.toUpperCase();
        });

        if (isDuplicate) {
          promptErrorMsg.textContent = "Tên này đã tồn tại, vui lòng chọn tên khác!";
          inpStudentName.focus();
          return;
        }

        closeNamePromptDialog();

        if (promptMode === "create") {
          const newStudent = createDefaultStudentProfile("std_" + Date.now(), typed, true);
          rootData.students.push(newStudent);
          switchActiveStudent(newStudent.id, true);
        } else if (promptMode === "rename" && promptTargetStudent) {
          promptTargetStudent.name = typed;
          silentSave();
          render();
        }
      }

      btnPromptSave.addEventListener("click", handleSaveNamePrompt);
      inpStudentName.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          handleSaveNamePrompt();
        }
      });

      // ========================================================================
      // POPUP XÁC NHẬN NỘI BỘ
      // ========================================================================
      let confirmResolveFn = null;
      function showCustomConfirm(title, message, isDanger = false) {
        return new Promise((resolve) => {
          confirmResolveFn = resolve;
          confirmTitle.textContent = title;
          confirmMsg.textContent = message;
          btnConfirmOk.className = "btn-action " + (isDanger ? "btn-confirm-danger" : "btn-confirm-ok");
          modalConfirm.classList.add("open");
          document.body.classList.add("scroll-locked");

          const handleChoice = (ok) => {
            modalConfirm.classList.remove("open");
            if (!hasAnyModalOpen()) {
              document.body.classList.remove("scroll-locked");
            }
            btnConfirmOk.onclick = null;
            btnConfirmCancel.onclick = null;
            confirmResolveFn = null;
            resolve(ok);
          };

          btnConfirmOk.onclick = () => handleChoice(true);
          btnConfirmCancel.onclick = () => handleChoice(false);
        });
      }

      // ========================================================================
      // RENDER VÀ ĐỒNG BỘ GIAO DIỆN
      // ========================================================================
      function render() {
        const std = getActiveStudent();

        lblActiveUserName.textContent = std.name;

        // CẬP NHẬT DÒNG NGÀY HỆ THỐNG TỰ ĐỘNG (BỎ CHỮ " NGÀY")
        lblLiveDate.textContent = getLiveDateFormatted();

        const { h, min } = (function () {
          const parsed = parseTimeString(std.gioVaoHoc || "12:30");
          return { h: parsed.h, min: parsed.m };
        })();
        const formattedStart = (h < 10 ? "0" + h : h) + ":" + (min < 10 ? "0" + min : min);
        valStartTime.textContent = formattedStart;
        valStartTime.setAttribute("placeholder", formattedStart);

        txtDayNote.readOnly = !isEditMode;
        valStartTime.contentEditable = isEditMode ? "true" : "false";

        // GỢI Ý MỜ CHO Ô GHI CHÚ
        const currentDayName = DAY_NAMES[String(currentDay)] || "Thứ Hai";
        dayNoteHeading.textContent = "Ghi chú " + currentDayName;
        txtDayNote.placeholder = isEditMode
          ? "Nhập ghi chú, bài tập về nhà, dặn dò..."
          : ("Chưa có ghi chú cho " + currentDayName + "...");

        if (isEditMode) {
          btnEditToggle.className = "btn-action btn-done";
          btnEditToggle.textContent = "Xong";
          document.body.classList.add("edit-mode-active");
        } else {
          btnEditToggle.className = "btn-action btn-edit";
          btnEditToggle.textContent = "Sửa";
          document.body.classList.remove("edit-mode-active");
        }

        tabButtons.forEach(tab => {
          const val = Number(tab.getAttribute("data-day"));
          const isSelected = (val === currentDay);
          tab.classList.toggle("active-tab", isSelected);
          tab.setAttribute("aria-selected", isSelected ? "true" : "false");
        });

        updateCalculatedScheduleTimes(std.gioVaoHoc || "12:30");

        // CẬP NHẬT 5 TIẾT HỌC BỐ CỤC 2 TẦNG
        const dayList = (std.monHoc && std.monHoc[String(currentDay)]) || [];
        for (let i = 0; i < 5; i++) {
          if (periodCards[i]) {
            periodCards[i].update(dayList[i] || "TRỐNG");
          }
        }

        // TỰ ĐỘNG CẬP NHẬT TIẾN TRÌNH TIẾT HỌC & GIỜ GIẢI LAO
        updateLiveActivePeriod();

        txtDayNote.value = (std.ghiChuTheoThu && std.ghiChuTheoThu[String(currentDay)]) || "";
      }

      daysTabBar.addEventListener("click", (e) => {
        const btn = e.target.closest(".day-tab-btn");
        if (!btn) return;
        const val = Number(btn.getAttribute("data-day"));
        if (val !== currentDay) {
          if (isEditMode) {
            commitStartTime();
            flushSaveNote();
          }
          currentDay = val;
          render();
        }
      });

      daysTabBar.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
          e.preventDefault();
          let delta = (e.key === "ArrowRight") ? 1 : -1;
          let nextDay = currentDay + delta;
          if (nextDay > 7) nextDay = 2;
          if (nextDay < 2) nextDay = 7;
          if (isEditMode) {
            commitStartTime();
            flushSaveNote();
          }
          currentDay = nextDay;
          render();
          const targetTab = document.getElementById("tab-btn-" + nextDay);
          if (targetTab) targetTab.focus();
        }
      });

      btnEditToggle.addEventListener("click", () => {
        if (isToggling) return;
        isToggling = true;

        if (isEditMode) {
          commitStartTime();
          flushSaveNote();
        }

        isEditMode = !isEditMode;

        if (!isEditMode) {
          if (document.activeElement && typeof document.activeElement.blur === "function") {
            document.activeElement.blur();
          }
        }
        render();

        setTimeout(() => {
          isToggling = false;
        }, 150);
      });

      function selectAllText(el) {
        setTimeout(() => {
          const range = document.createRange();
          range.selectNodeContents(el);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
        }, 50);
      }

      function sanitizePasteNumeric(e, allowColon = false) {
        e.preventDefault();
        const text = (e.clipboardData || window.clipboardData).getData("text/plain");
        const clean = allowColon ? text.replace(/[^\d:]/g, "") : text.replace(/\D/g, "");
        document.execCommand("insertText", false, clean);
      }

      valStartTime.addEventListener("paste", (e) => sanitizePasteNumeric(e, true));

      function commitStartTime() {
        const std = getActiveStudent();
        let typed = valStartTime.textContent.trim();
        const { h, m } = parseTimeString(typed);
        const cleanTime = (h < 10 ? "0" + h : h) + ":" + (m < 10 ? "0" + m : m);
        std.gioVaoHoc = cleanTime;
        valStartTime.textContent = cleanTime;
        valStartTime.setAttribute("placeholder", cleanTime);
        updateCalculatedScheduleTimes(cleanTime);
        silentSave();
      }

      valStartTime.addEventListener("focus", function () {
        if (!isEditMode) return;
        selectAllText(this);
      });

      valStartTime.addEventListener("blur", commitStartTime);
      valStartTime.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          commitStartTime();
          valStartTime.blur();
        }
      });

      txtDayNote.addEventListener("input", debouncedSaveNote);
      txtDayNote.addEventListener("change", flushSaveNote);
      txtDayNote.addEventListener("blur", flushSaveNote);

      btnSheetClose.addEventListener("click", () => closePicker(true));
      btnSheetCancel.addEventListener("click", () => closePicker(true));

      // ĐỒNG BỘ CLICK-OUTSIDE ĐÓNG CẢ 4 MODAL
      modalPicker.addEventListener("click", (e) => {
        if (e.target === modalPicker) closePicker(true);
      });

      modalNamePrompt.addEventListener("click", (e) => {
        if (e.target === modalNamePrompt) closeNamePromptDialog();
      });

      modalStudentActions.addEventListener("click", (e) => {
        if (e.target === modalStudentActions) closeStudentActionSheet();
      });

      modalConfirm.addEventListener("click", (e) => {
        if (e.target === modalConfirm) {
          if (typeof confirmResolveFn === "function") {
            modalConfirm.classList.remove("open");
            if (!hasAnyModalOpen()) {
              document.body.classList.remove("scroll-locked");
            }
            btnConfirmOk.onclick = null;
            btnConfirmCancel.onclick = null;
            const res = confirmResolveFn;
            confirmResolveFn = null;
            res(false);
          }
        }
      });

      // NÚT "DỮ LIỆU MẪU": NẠP THỜI KHOÁ BIỂU MẪU VÍ DỤ, GIỮ NGUYÊN TÊN HỌC SINH
      btnReset.addEventListener("click", async () => {
        btnReset.disabled = true;
        const std = getActiveStudent();

        const agreed = await showCustomConfirm(
          "Tải Dữ Liệu Mẫu",
          "Bạn có muốn tải \"Dữ Liệu Mẫu\" vào thời khoá biểu của \"" + std.name + "\" không?\n\nToàn bộ thời khoá biểu của học sinh này sẽ được điền bằng thời khoá biểu mẫu ví dụ (tên học sinh vẫn giữ nguyên).",
          false
        );

        if (agreed) {
          std.gioVaoHoc = "12:30";
          std.monHoc = JSON.parse(JSON.stringify(SAMPLE_TIMETABLE));
          std.ghiChuTheoThu = { "2": "", "3": "", "4": "", "5": "", "6": "", "7": "" };
          std.monHocList = [...DEFAULT_BASE_SUBJECTS];

          silentSave();
          buildPickerSheet();
          render();
        }

        setTimeout(() => {
          btnReset.disabled = false;
        }, 300);
      });

      window.addEventListener("popstate", () => {
        if (modalConfirm.classList.contains("open")) {
          modalConfirm.classList.remove("open");
          return;
        }
        if (modalNamePrompt.classList.contains("open")) {
          closeNamePromptDialog();
          return;
        }
        if (modalStudentActions.classList.contains("open")) {
          closeStudentActionSheet();
          return;
        }
        if (modalPicker.classList.contains("open")) {
          closePicker(false);
        }
      });

      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (modalConfirm.classList.contains("open")) {
            modalConfirm.classList.remove("open");
            return;
          }
          if (modalNamePrompt.classList.contains("open")) {
            closeNamePromptDialog();
            return;
          }
          if (modalStudentActions.classList.contains("open")) {
            closeStudentActionSheet();
            return;
          }
          if (modalPicker.classList.contains("open")) {
            closePicker(true);
          }
          if (userDropdown.classList.contains("open")) {
            closeUserDropdown();
          }
        }
      });

      window.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") {
          flushSaveNote();
        } else {
          updateLiveActivePeriod();
        }
      });
      window.addEventListener("beforeunload", flushSaveNote);

      // TỰ ĐỘNG CẬP NHẬT TIẾN TRÌNH TIẾT HỌC, GIỜ GIẢI LAO & NGÀY XUYÊN ĐÊM MỖI 30 GIÂY
      setInterval(updateLiveActivePeriod, 30000);

      // KHỞI CHẠY HỆ THỐNG
      buildPickerSheet();
      render();
    })();
  </script>
</body>
</html>
