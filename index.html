<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thời Khoá Biểu - Dương Tấn Chánh</title>
  <style>
    /* ==========================================================================
       1. RESET & BOX-SIZING
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ==========================================================================
       2. BẢNG MÀU CHUẨN (11 MÃ MÀU QUY CHUẨN TẠI :ROOT)
       ========================================================================== */
    :root {
      --c-blue: #0066B6;
      --c-purple: #4020D0;
      --c-lime: #7FDD0F;
      --c-green: #009911;
      --c-orange: #EE6000;
      --c-red: #FF2040;
      --c-black: #000000;
      --c-dark-1: #1A1A1A;
      --c-dark-2: #262626;
      --c-gray: #CCCCCC;
      --c-white: #FFFFFF;
      --font-stack: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* ==========================================================================
       3. BỐ CỤC CHUNG & TYPOGRAPHY (FONT BODY: 1.2REM)
       ========================================================================== */
    body {
      font-family: var(--font-stack);
      font-size: 1.2rem;
      font-weight: normal;
      color: var(--c-white);
      background-color: var(--c-black);
      padding: 0.5rem;
      padding-bottom: 5rem;
      word-break: normal;
      overflow-wrap: break-word;
      line-height: 1.45;
      -webkit-text-size-adjust: 100%;
    }

    body.scroll-locked {
      overflow: hidden;
      touch-action: none;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: bold;
      text-align: center;
      color: var(--c-white);
      margin-top: 0.1rem;
      margin-bottom: 0.1rem;
    }

    .author-signature {
      font-size: 1.2rem;
      font-weight: normal;
      text-align: right;
      color: var(--c-gray);
      margin-bottom: 0.4rem;
    }

    h2 {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--c-white);
    }

    h3 {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--c-white);
    }

    h4, h5 {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--c-white);
    }

    :focus-visible {
      outline: 2px solid var(--c-lime);
      outline-offset: 2px;
    }

    /* ==========================================================================
       4. THANH NÚT TÁC VỤ & BỘ CHỌN HỌC SINH (ICON ĐỒNG BỘ NỀN XANH CHỮ TRẮNG)
       ========================================================================== */
    .top-actions-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem;
      margin-bottom: 0.4rem;
      width: 100%;
    }

    .user-selector-wrap {
      position: relative;
      display: flex;
      align-items: center;
      min-width: 0;
      flex: 1 1 auto;
    }

    .btn-user-select {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 0.4rem 0.65rem;
      border-radius: 0.4rem;
      border: 2px solid var(--c-blue);
      background-color: var(--c-dark-1);
      color: var(--c-white);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      touch-action: manipulation;
      transition: transform 0.08s ease;
      max-width: 12.5rem;
    }

    .btn-user-select:active {
      transform: scale(0.96);
    }

    /* Icon người dùng: Vòng tròn xanh lá + người màu trắng */
    .avatar-circle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.8rem;
      height: 1.8rem;
      background-color: var(--c-green);
      border-radius: 50%;
      flex-shrink: 0;
      padding: 0.2rem;
    }

    .avatar-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Tên học sinh có khoảng đệm 0.5rem với tam giác ▼ */
    .btn-user-name-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-right: 0.5rem;
    }

    .user-dropdown-arrow {
      font-size: 0.85rem;
      color: var(--c-gray);
      flex-shrink: 0;
      line-height: 1;
    }

    .user-dropdown-menu {
      position: absolute;
      top: calc(100% + 0.35rem);
      left: 0;
      width: 17.5rem;
      max-width: 90vw;
      background-color: var(--c-dark-1);
      border: 2px solid var(--c-blue);
      border-radius: 0.5rem;
      padding: 0.5rem;
      z-index: 1000;
      display: none;
      flex-direction: column;
      gap: 0.4rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.9);
    }

    .user-dropdown-menu.open {
      display: flex;
    }

    /* DANH SÁCH HỌC SINH NỚI RỘNG RÃI CHỐNG BẤM NHẦM */
    .user-list-scroll {
      max-height: 16rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      padding: 0.2rem 0;
    }

    .user-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 0.8rem;
      min-height: 3.3rem;
      background-color: var(--c-dark-2);
      border: 2px solid transparent;
      border-radius: 0.45rem;
      cursor: pointer;
      gap: 0.6rem;
    }

    .user-item-row.active {
      border-color: var(--c-lime);
      background-color: var(--c-black);
    }

    .user-item-title {
      flex: 1 1 auto;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: bold;
      font-size: 1.2rem;
      color: var(--c-white);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .user-item-check {
      color: var(--c-lime);
      font-weight: bold;
    }

    /* Nút bánh răng nới rộng 2.5rem tránh bấm nhầm */
    .btn-user-gear {
      flex: 0 0 auto;
      min-width: 2.5rem;
      min-height: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--c-dark-1);
      border: 2px solid var(--c-gray);
      border-radius: 0.35rem;
      color: var(--c-white);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0;
      touch-action: manipulation;
    }

    /* Nút "Thêm học sinh" với icon tròn xanh lá dấu cộng trắng */
    .btn-create-user {
      width: 100%;
      padding: 0.55rem 0.6rem;
      background-color: var(--c-blue);
      border: 2px solid var(--c-blue);
      color: var(--c-white);
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 0.4rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 0.25rem;
      touch-action: manipulation;
    }

    .plus-circle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.8rem;
      height: 1.8rem;
      background-color: var(--c-green);
      border-radius: 50%;
      flex-shrink: 0;
      padding: 0.25rem;
    }

    .plus-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .top-actions-right {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-shrink: 0;
      margin-left: auto;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 0.45rem 0.95rem;
      border-radius: 0.4rem;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      touch-action: manipulation;
      transition: transform 0.08s ease;
      will-change: transform;
    }

    .btn-action:active {
      transform: scale(0.96);
    }

    .btn-action.btn-edit {
      background-color: var(--c-orange);
      border: 2px solid var(--c-orange);
      color: var(--c-white);
    }

    .btn-action.btn-done {
      background-color: var(--c-green);
      border: 2px solid var(--c-green);
      color: var(--c-white);
    }

    .btn-action.btn-reset {
      background-color: var(--c-dark-1);
      border: 2px solid var(--c-red);
      color: var(--c-red);
    }

    /* ==========================================================================
       5. BỘ CHỌN THỜI GIAN: CHỮ TỰ NHIÊN ÔM SÁT 100%, 2 KHOẢNG TRẮNG
       ========================================================================== */
    .date-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.25rem 0.8rem;
      padding: 0.55rem 0.7rem;
      background-color: var(--c-dark-1);
      border: 2px solid var(--c-dark-2);
      border-radius: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .date-unit {
      display: inline-flex;
      align-items: center;
      gap: 0.15rem;
    }

    .date-label {
      font-weight: bold;
      color: var(--c-lime);
      font-size: 1.2rem;
      user-select: none;
      margin-right: 0.35rem;
    }

    .date-slash {
      font-weight: bold;
      color: var(--c-lime);
      margin: 0 0.05rem;
      user-select: none;
      font-size: 1.2rem;
    }

    .date-bullet {
      font-weight: bold;
      color: var(--c-lime);
      user-select: none;
      font-size: 1.2rem;
    }

    @media (max-width: 440px) {
      .date-bullet {
        display: none;
      }
    }

    .date-val {
      display: inline-block;
      padding: 0.15rem 0.35rem;
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--c-white);
      border: 2px solid transparent;
      border-radius: 0.35rem;
      text-align: center;
      white-space: nowrap;
      min-width: 2.2rem;
    }

    .date-val:empty::before {
      content: attr(placeholder);
      color: var(--c-gray);
      opacity: 0.4;
    }

    .edit-mode-active .date-val {
      border: 2px solid var(--c-blue);
      background-color: var(--c-black);
      outline: none;
    }

    .date-edit-select {
      display: none;
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 0.15rem 0.35rem;
      border: 2px solid var(--c-blue);
      background-color: var(--c-black);
      color: var(--c-white);
      border-radius: 0.35rem;
      width: auto;
      text-align: center;
      -webkit-appearance: none;
      appearance: none;
    }

    .edit-mode-active .date-edit-select {
      display: inline-block;
    }

    .edit-mode-active #view-month {
      display: none;
    }

    /* ==========================================================================
       6. THANH ĐIỀU HƯỚNG THỨ
       ========================================================================== */
    .days-tab-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.4rem;
      margin-bottom: 0.6rem;
    }

    .day-tab-btn {
      flex: 0 0 auto;
      min-width: 5.4rem;
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 0.45rem 0.4rem;
      border: 2px solid var(--c-gray);
      background-color: var(--c-dark-1);
      color: var(--c-white);
      border-radius: 0.4rem;
      cursor: pointer;
      text-align: center;
      user-select: none;
      white-space: nowrap;
      touch-action: manipulation;
      transition: transform 0.08s ease;
      will-change: transform;
    }

    .day-tab-btn:active {
      transform: scale(0.96);
    }

    .day-tab-btn.active-tab {
      background-color: var(--c-blue);
      border-color: var(--c-white);
      color: var(--c-white);
    }

    /* ==========================================================================
       7. DANH SÁCH 5 TIẾT CHIỀU
       ========================================================================== */
    .periods-list {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      margin-bottom: 0.8rem;
    }

    .period-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.55rem 0.7rem;
      border: 2px solid var(--c-dark-2);
      background-color: var(--c-dark-1);
      border-left: 6px solid var(--c-blue);
      border-radius: 0.5rem;
    }

    .period-meta {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
    }

    .p-name {
      font-weight: bold;
      font-size: 1.2rem;
      color: var(--c-white);
    }

    .p-time {
      font-size: 1.2rem;
      color: var(--c-gray);
      font-weight: normal;
      white-space: nowrap;
    }

    .subject-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 6.2rem;
      max-width: 9.5rem;
      padding: 0.4rem 0.6rem;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 0.4rem;
      user-select: none;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      touch-action: manipulation;
      transition: transform 0.08s ease;
      will-change: transform;
    }

    .edit-mode-active .subject-badge {
      cursor: pointer;
      outline: 2px dashed var(--c-orange);
      outline-offset: 2px;
    }

    .edit-mode-active .subject-badge:active {
      transform: scale(0.95);
    }

    /* ==========================================================================
       8. PHỐI MÀU MÔN HỌC
       ========================================================================== */
    .sub-default {
      background-color: var(--c-green);
      color: var(--c-white);
      border: 2px solid var(--c-green);
    }

    .sub-shl {
      background-color: var(--c-purple);
      color: var(--c-white);
      border: 2px solid var(--c-purple);
    }

    .sub-gdtc {
      background-color: var(--c-orange);
      color: var(--c-white);
      border: 2px solid var(--c-orange);
    }

    .sub-empty {
      background-color: var(--c-black);
      color: var(--c-gray);
      border: 2px dashed var(--c-gray);
    }

    /* ==========================================================================
       9. GHI CHÚ THEO THỨ (CAO 13.5REM)
       ========================================================================== */
    .day-note-box {
      border: 2px solid var(--c-dark-2);
      background-color: var(--c-dark-1);
      border-radius: 0.5rem;
      padding: 0.5rem;
      margin-bottom: 1rem;
    }

    .day-note-box h2 {
      margin-bottom: 0.4rem;
    }

    .day-note-textarea {
      width: 100%;
      min-height: 13.5rem;
      font-family: inherit;
      font-size: 1.2rem;
      line-height: 1.45;
      padding: 0.55rem;
      border: 2px solid var(--c-dark-2);
      background-color: var(--c-black);
      border-radius: 0.4rem;
      color: var(--c-white);
      outline: none;
      resize: none;
      scroll-margin-bottom: 5rem;
    }

    .day-note-textarea:read-only {
      border: 2px dashed var(--c-dark-2);
    }

    .edit-mode-active .day-note-textarea {
      border: 2px solid var(--c-blue);
    }

    /* ==========================================================================
       10. HỘP THOẠI CHỌN MÔN (CENTERED MODAL)
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 0.25rem;
      touch-action: none;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .picker-sheet {
      width: 98%;
      max-width: 26rem;
      background-color: var(--c-dark-1);
      border: 2px solid var(--c-blue);
      border-radius: 0.6rem;
      padding: 0.45rem 0.5rem;
      max-height: 85vh;
      max-height: 85dvh;
      overflow-y: auto;
      touch-action: pan-y;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
    }

    .picker-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.35rem;
      border-bottom: 2px solid var(--c-dark-2);
      margin-bottom: 0.45rem;
    }

    .sheet-title-text {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--c-white);
    }

    .btn-close-sheet {
      background: none;
      border: none;
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--c-gray);
      cursor: pointer;
      padding: 0 0.3rem;
      touch-action: manipulation;
    }

    .custom-subject-bar {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      width: 100%;
      margin-bottom: 0.5rem;
    }

    .custom-subject-input {
      flex: 1 1 0;
      min-width: 0;
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 0.35rem 0.45rem;
      border-radius: 0.4rem;
      border: 2px solid var(--c-dark-2);
      background-color: var(--c-black);
      color: var(--c-white);
      outline: none;
      text-transform: uppercase;
    }

    .custom-subject-input:focus {
      border-color: var(--c-blue);
    }

    .btn-add-sub {
      flex: 0 0 auto;
      white-space: nowrap;
      background-color: var(--c-blue);
      border: 2px solid var(--c-blue);
      color: var(--c-white);
      padding: 0.35rem 0.65rem;
      font-size: 1.2rem;
    }

    .picker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(5.8rem, 1fr));
      gap: 0.5rem;
      padding: 0.4rem 0.25rem;
      margin-bottom: 0.5rem;
    }

    .custom-sub-item-wrap {
      position: relative;
      display: flex;
      width: 100%;
    }

    .btn-subject-item {
      width: 100%;
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 0.5rem 0.2rem;
      border-radius: 0.4rem;
      border: 2px solid transparent;
      cursor: pointer;
      text-align: center;
      user-select: none;
      touch-action: manipulation;
      transition: transform 0.08s ease;
      will-change: transform;
    }

    .btn-subject-item:active {
      transform: scale(0.95);
    }

    .btn-del-sub-badge {
      position: absolute;
      top: -0.35rem;
      right: -0.35rem;
      width: 1.4rem;
      height: 1.4rem;
      background-color: var(--c-red);
      border: 2px solid var(--c-black);
      border-radius: 50%;
      color: var(--c-white);
      font-size: 1.0rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 3;
      padding: 0;
      line-height: 1;
      touch-action: manipulation;
    }

    .btn-sheet-cancel-btn {
      width: 100%;
      padding: 0.45rem;
      background-color: var(--c-dark-2);
      border: 2px solid var(--c-gray);
      color: var(--c-white);
      font-size: 1.2rem;
    }

    /* ==========================================================================
       11. HỘP THOẠI NHẬP TÊN HỌC SINH (THÊM MỚI / ĐỔI TÊN)
       ========================================================================== */
    #modal-name-prompt {
      z-index: 10000;
    }

    .prompt-box {
      width: 92%;
      max-width: 23rem;
      background-color: var(--c-dark-1);
      border: 2px solid var(--c-blue);
      border-radius: 0.7rem;
      padding: 1.2rem 1.0rem;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .prompt-title {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--c-white);
      text-align: center;
    }

    .prompt-input {
      width: 100%;
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 0.55rem 0.65rem;
      border-radius: 0.4rem;
      border: 2px solid var(--c-dark-2);
      background-color: var(--c-black);
      color: var(--c-white);
      outline: none;
    }

    .prompt-input:focus {
      border-color: var(--c-blue);
    }

    .prompt-input::placeholder {
      color: var(--c-gray);
      opacity: 0.4;
    }

    .prompt-error {
      color: var(--c-orange);
      font-size: 1.1rem;
      font-weight: bold;
      min-height: 1.4rem;
      text-align: center;
    }

    .prompt-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.85rem;
    }

    /* ==========================================================================
       12. HỘP THOẠI CẤU HÌNH HỌC SINH (⚙️ ĐÃ DÃN CÁCH RỘNG RÃI TRÁNH BẤM NHẦM)
       ========================================================================== */
    #modal-student-actions {
      z-index: 10000;
    }

    .student-actions-box {
      width: 90%;
      max-width: 22rem;
      background-color: var(--c-dark-1);
      border: 2px solid var(--c-blue);
      border-radius: 0.7rem;
      padding: 1.2rem 1.0rem;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .student-actions-title {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--c-white);
      text-align: center;
      padding-bottom: 0.6rem;
      border-bottom: 2px solid var(--c-dark-2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 0.2rem;
    }

    .btn-student-act {
      width: 100%;
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 0.75rem 1.0rem;
      min-height: 3.2rem;
      border-radius: 0.45rem;
      cursor: pointer;
      text-align: center;
      border: 2px solid transparent;
      touch-action: manipulation;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-student-rename {
      background-color: var(--c-blue);
      border-color: var(--c-blue);
      color: var(--c-white);
    }

    .btn-student-delete {
      background-color: var(--c-dark-1);
      border-color: var(--c-red);
      color: var(--c-red);
      margin-bottom: 0.3rem;
    }

    .btn-student-cancel-act {
      background-color: var(--c-dark-2);
      border-color: var(--c-gray);
      color: var(--c-white);
    }

    /* ==========================================================================
       13. POPUP XÁC NHẬN NỘI BỘ (Z-INDEX 10001 NỔI TRÊN CÙNG)
       ========================================================================== */
    #modal-confirm {
      z-index: 10001;
    }

    .confirm-box {
      width: 92%;
      max-width: 24rem;
      background-color: var(--c-dark-1);
      border: 2px solid var(--c-orange);
      border-radius: 0.6rem;
      padding: 1.0rem;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.9);
      text-align: center;
    }

    .confirm-title {
      color: var(--c-orange);
      margin-bottom: 0.6rem;
    }

    .confirm-msg {
      font-size: 1.2rem;
      color: var(--c-white);
      line-height: 1.5;
      margin-bottom: 1.2rem;
      text-align: left;
    }

    .confirm-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.85rem;
    }

    .btn-confirm-cancel {
      background-color: var(--c-dark-2);
      border: 2px solid var(--c-gray);
      color: var(--c-white);
    }

    .btn-confirm-ok {
      background-color: var(--c-blue);
      border: 2px solid var(--c-blue);
      color: var(--c-white);
    }

    .btn-confirm-danger {
      background-color: var(--c-red);
      border: 2px solid var(--c-red);
      color: var(--c-white);
    }
  </style>
</head>
<body>

  <!-- TIÊU ĐỀ & TÁC GIẢ -->
  <h1>THỜI KHOÁ BIỂU</h1>
  <div class="author-signature">Dương Tấn Chánh</div>

  <!-- THANH NÚT TÁC VỤ & CHỌN HỌC SINH -->
  <div class="top-actions-bar">
    <!-- Bên trái: Nút chọn học sinh -->

    <!-- Bên phải: Cố định sát phải, không bao giờ rớt dòng -->

      <button type="button" class="btn-action btn-reset" id="btn-reset">Đặt Lại</button>
    </div>
  </div>

  <!-- THÁNG / NĂM / GIỜ VÀO HỌC (CHỮ TỰ NHIÊN CO DÃN 100%) -->
  <div class="date-strip">
    <div class="date-unit">
      <span class="date-label">Tháng</span>

      <select id="sel-month" class="date-edit-select">
        <option value="1">01</option>
        <option value="2">02</option>
        <option value="3">03</option>
        <option value="4">04</option>
        <option value="5">05</option>
        <option value="6">06</option>
        <option value="7">07</option>
        <option value="8">08</option>
        <option value="9">09</option>

      <span class="date-slash">/</span>

    <span class="date-bullet">•</span>
    
    <div class="date-unit">
      <span class="date-label">Vào học</span>
      <span id="val-start-time" class="date-val" inputmode="numeric">12:30</span>

  <!-- CÁC NÚT THỨ: CANH GIỮA -->
  <div class="days-tab-bar" role="tablist">
    <button type="button" class="day-tab-btn" id="tab-btn-2" data-day="2" role="tab" aria-controls="list-periods">Thứ 2</button>
    <button type="button" class="day-tab-btn" id="tab-btn-3" data-day="3" role="tab" aria-controls="list-periods">Thứ 3</button>
    <button type="button" class="day-tab-btn" id="tab-btn-4" data-day="4" role="tab" aria-controls="list-periods">Thứ 4</button>
    <button type="button" class="day-tab-btn" id="tab-btn-5" data-day="5" role="tab" aria-controls="list-periods">Thứ 5</button>
    <button type="button" class="day-tab-btn" id="tab-btn-6" data-day="6" role="tab" aria-controls="list-periods">Thứ 6</button>
    <button type="button" class="day-tab-btn" id="tab-btn-7" data-day="7" role="tab" aria-controls="list-periods">Thứ 7</button>
  </div>

  <!-- DANH SÁCH 5 TIẾT CHIỀU -->

  <!-- GHI CHÚ THEO TỪNG THỨ (GIỚI HẠN AN TOÀN 5000 KÝ TỰ) -->

    <h2 id="day-note-heading">Ghi chú Thứ Hai</h2>
    <textarea class="day-note-textarea" id="txt-day-note" maxlength="5000" readonly></textarea>
  </div>

  <!-- HỘP THOẠI CHỌN MÔN (CENTERED MODAL) -->
  <div class="modal-backdrop" id="modal-picker" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="picker-sheet">
      <div class="picker-header">
        <h3 class="sheet-title-text" id="sheet-title">Chọn môn</h3>
        <button type="button" class="btn-close-sheet" id="btn-sheet-close" aria-label="Đóng">&times;</button>
      </div>

      <div class="custom-subject-bar">
        <input type="text" id="inp-custom-subject" class="custom-subject-input" placeholder="Tự nhập môn khác..." maxlength="15">
        <button type="button" id="btn-add-custom-subject" class="btn-action btn-add-sub">+ Chọn</button>

      <div class="picker-grid" id="sheet-grid"></div>

      <button type="button" class="btn-action btn-sheet-cancel-btn" id="btn-sheet-cancel">
        Đóng

  <!-- HỘP THOẠI NHẬP TÊN HỌC SINH (THÊM MỚI / ĐỔI TÊN) -->
  <div class="modal-backdrop" id="modal-name-prompt" role="dialog" aria-modal="true">
    <div class="prompt-box">
      <h3 class="prompt-title" id="prompt-dialog-title">Thêm Học Sinh Mới</h3>
      <input type="text" id="inp-student-name" class="prompt-input" maxlength="15" placeholder="Học Sinh 1">
      <div class="prompt-error" id="prompt-error-msg"></div>
      <div class="prompt-actions">
        <button type="button" class="btn-action btn-confirm-cancel" id="btn-prompt-cancel">Hủy</button>
        <button type="button" class="btn-action btn-confirm-ok" id="btn-prompt-save">Lưu</button>
      </div>
    </div>
  </div>

  <!-- HỘP THOẠI CẤU HÌNH HỌC SINH (⚙️ ĐÃ DÃN CÁCH RỘNG RÃI TRÁNH BẤM NHẦM) -->
  <div class="modal-backdrop" id="modal-student-actions" role="dialog" aria-modal="true">
    <div class="student-actions-box">
      <div class="student-actions-title" id="student-actions-target-name">Học Sinh 1</div>
      <button type="button" class="btn-student-act btn-student-rename" id="btn-act-rename">✏️ Đổi Tên</button>
      <button type="button" class="btn-student-act btn-student-delete" id="btn-act-delete">🗑️ Xoá Học Sinh</button>
      <button type="button" class="btn-student-act btn-student-cancel-act" id="btn-act-cancel">Đóng</button>
    </div>
  </div>

  <!-- POPUP XÁC NHẬN NỘI BỘ -->
  <div class="modal-backdrop" id="modal-confirm" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="confirm-box">
      <h3 class="confirm-title" id="confirm-title">Xác Nhận</h3>
      <p class="confirm-msg" id="confirm-msg"></p>
      <div class="confirm-actions">
        <button type="button" class="btn-action btn-confirm-cancel" id="btn-confirm-cancel">Hủy</button>
        <button type="button" class="btn-action btn-confirm-ok" id="btn-confirm-ok">Đồng Ý</button>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT XỬ LÝ TOÀN BỘ LOGIC HỆ THỐNG ĐÃ TỐI ƯU HOÀN THIỆN -->
  <script>
    (function () {
      "use strict";

      const DEFAULT_BASE_SUBJECTS = [
        "TOÁN", "VĂN", "ANH", "KH TN", "TIN", "SỬ", "ĐỊA", "GD TC",
        "C.NGHỆ", "GD CD", "GD ĐP", "NHẠC", "VẼ", "HĐ TN", "S H L"
      ];

      const SAMPLE_TIMETABLE = {
        "2": ["TIN", "GD TC", "ANH", "HĐ TN", "HĐ TN"],
        "3": ["TOÁN", "TOÁN", "VĂN", "KH TN", "ĐỊA"],
        "4": ["NHẠC", "GD TC", "GD CD", "C.NGHỆ", "TOÁN"],
        "5": ["VẼ", "ANH", "GD ĐP", "VĂN", "SỬ"],
        "6": ["TOÁN", "VĂN", "VĂN", "KH TN", "KH TN"],
        "7": ["SỬ", "KH TN", "HĐ TN", "C.NGHỆ", "ANH"]
      };

      const NOW = new Date();
      const CURRENT_REAL_YEAR = NOW.getFullYear();
      const CURRENT_REAL_MONTH = NOW.getMonth() + 1;

      function createDefaultStudentProfile(id, name) {
        return {
          id: id || ("std_" + Date.now()),
          name: name || "Học Sinh 1",
          nam: CURRENT_REAL_YEAR,
          thang: CURRENT_REAL_MONTH,
          gioVaoHoc: "12:30",
          monHoc: JSON.parse(JSON.stringify(SAMPLE_TIMETABLE)),
          ghiChuTheoThu: { "2": "", "3": "", "4": "", "5": "", "6": "", "7": "" },
          monHocList: [...DEFAULT_BASE_SUBJECTS]
        };
      }

      const inMemoryStore = {};
      const SafeStorage = {
        getItem(key) {
          try {
            return localStorage.getItem(key);
          } catch (e) {
            return inMemoryStore[key] || null;
          }
        },
        setItem(key, val) {
          try {
            localStorage.setItem(key, val);
          } catch (e) {
            inMemoryStore[key] = String(val);
          }
        }
      };

      const STORAGE_KEY = "tkb_multi_user_app_v21_flawless";

      let rootData = loadRootData();
      let currentDay = getTodayIndex();
      let isEditMode = false;
      let editTargetIndex = null;
      let isToggling = false;

      let targetedStudentForAction = null;

      function loadRootData() {
        try {
          const raw = SafeStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && typeof parsed === "object" && Array.isArray(parsed.students) && parsed.students.length > 0) {
              if (!parsed.activeId || !parsed.students.some(s => s.id === parsed.activeId)) {
                parsed.activeId = parsed.students[0].id;
              }
              return parsed;
            }
          }
        } catch (e) {
          console.warn("Lỗi đọc dữ liệu đa học sinh, tạo mới.", e);
        }

        const initialStudent = createDefaultStudentProfile("std_default", "Học Sinh 1");
        return {
          activeId: initialStudent.id,
          students: [initialStudent]
        };
      }

      function getActiveStudent() {
        let std = rootData.students.find(s => s.id === rootData.activeId);
        if (!std) {
          std = rootData.students[0];
          rootData.activeId = std.id;
        }
        return std;
      }

      function silentSave() {
        const std = getActiveStudent();
        if (isEditMode && txtDayNote) {
          if (!std.ghiChuTheoThu) std.ghiChuTheoThu = {};
          std.ghiChuTheoThu[String(currentDay)] = txtDayNote.value;
        }
        SafeStorage.setItem(STORAGE_KEY, JSON.stringify(rootData));
      }

      let saveNoteTimer = null;
      function debouncedSaveNote() {
        clearTimeout(saveNoteTimer);
        saveNoteTimer = setTimeout(() => {
          silentSave();
        }, 300);
      }
      function flushSaveNote() {
        clearTimeout(saveNoteTimer);
        silentSave();
      }

      function parseTimeString(timeStr) {
        if (!timeStr) return { h: 12, m: 30 };
        let clean = String(timeStr).trim().replace(/[hH.\s]/g, ":");
        if (/^\d{3,4}$/.test(clean)) {
          if (clean.length === 3) {
            clean = clean.slice(0, 1) + ":" + clean.slice(1);
          } else {
            clean = clean.slice(0, 2) + ":" + clean.slice(2);
          }
        }
        let parts = clean.split(":");
        let h = parseInt(parts[0], 10);
        let m = parseInt(parts[1], 10);
        if (isNaN(h) || h < 0 || h > 23) h = 12;
        if (isNaN(m) || m < 0 || m > 59) m = 30;
        return { h, m };
      }

      function formatMinutesToTime(totalMins) {
        let h = Math.floor(totalMins / 60) % 24;
        let m = totalMins % 60;
        let mStr = m < 10 ? "0" + m : String(m);
        let displayH = h > 12 ? h - 12 : (h === 0 ? 12 : h);
        return displayH + ":" + mStr;
      }

      function calculateTimeSlots(startTimeStr) {
        const { h, m } = parseTimeString(startTimeStr);
        let currentMin = h * 60 + m;
        const breaks = [5, 5, 15, 5];
        const slots = [];

        for (let i = 0; i < 5; i++) {
          let pStart = currentMin;
          let pEnd = pStart + 45;
          slots.push({
            label: "Tiết " + (i + 1),
            gio: formatMinutesToTime(pStart) + " - " + formatMinutesToTime(pEnd)
          });
          if (i < 4) {
            currentMin = pEnd + breaks[i];
          }
        }
        return slots;
      }

      function getTodayIndex() {
        const d = new Date().getDay();
        if (d >= 1 && d <= 6) return d + 1;
        return 2;
      }

      const DAY_NAMES = {
        "2": "Thứ Hai",
        "3": "Thứ Ba",
        "4": "Thứ Tư",
        "5": "Thứ Năm",
        "6": "Thứ Sáu",
        "7": "Thứ Bảy"
      };

      // DOM ELEMENTS
      const btnUserToggle = document.getElementById("btn-user-toggle");
      const lblActiveUserName = document.getElementById("lbl-active-user-name");
      const userDropdown = document.getElementById("user-dropdown");
      const userListContainer = document.getElementById("user-list-container");
      const btnCreateUserTrigger = document.getElementById("btn-create-user-trigger");

      const btnEditToggle = document.getElementById("btn-edit-toggle");
      const btnReset = document.getElementById("btn-reset");

      const viewMonth = document.getElementById("view-month");
      const selMonth = document.getElementById("sel-month");
      const valYear = document.getElementById("val-year");
      const valStartTime = document.getElementById("val-start-time");

      const daysTabBar = document.querySelector(".days-tab-bar");
      const tabButtons = Array.from(daysTabBar.querySelectorAll(".day-tab-btn"));
      const listPeriods = document.getElementById("list-periods");
      const dayNoteHeading = document.getElementById("day-note-heading");
      const txtDayNote = document.getElementById("txt-day-note");

      // MODALS
      const modalPicker = document.getElementById("modal-picker");
      const sheetTitle = document.getElementById("sheet-title");
      const sheetGrid = document.getElementById("sheet-grid");
      const inpCustomSubject = document.getElementById("inp-custom-subject");
      const btnAddCustomSubject = document.getElementById("btn-add-custom-subject");
      const btnSheetClose = document.getElementById("btn-sheet-close");
      const btnSheetCancel = document.getElementById("btn-sheet-cancel");

      const modalNamePrompt = document.getElementById("modal-name-prompt");
      const promptDialogTitle = document.getElementById("prompt-dialog-title");
      const inpStudentName = document.getElementById("inp-student-name");
      const promptErrorMsg = document.getElementById("prompt-error-msg");
      const btnPromptCancel = document.getElementById("btn-prompt-cancel");
      const btnPromptSave = document.getElementById("btn-prompt-save");

      const modalStudentActions = document.getElementById("modal-student-actions");
      const studentActionsTargetName = document.getElementById("student-actions-target-name");
      const btnActRename = document.getElementById("btn-act-rename");
      const btnActDelete = document.getElementById("btn-act-delete");
      const btnActCancel = document.getElementById("btn-act-cancel");

      const modalConfirm = document.getElementById("modal-confirm");
      const confirmTitle = document.getElementById("confirm-title");
      const confirmMsg = document.getElementById("confirm-msg");
      const btnConfirmCancel = document.getElementById("btn-confirm-cancel");
      const btnConfirmOk = document.getElementById("btn-confirm-ok");

      // KIỂM TRA TẤT CẢ CÁC MODAL ĐANG MỞ
      function hasAnyModalOpen() {
        return modalPicker.classList.contains("open") ||
               modalNamePrompt.classList.contains("open") ||
               modalStudentActions.classList.contains("open") ||
               modalConfirm.classList.contains("open");
      }

      function getSubjectColorClass(name) {
        const clean = (name || "").replace(/\s+/g, ' ').trim().toUpperCase();
        if (clean === "S H L" || clean.includes("S H L")) return "sub-shl";
        if (clean === "GD TC") return "sub-gdtc";
        if (clean === "TRỐNG") return "sub-empty";
        return "sub-default";
      }

      let activeStudent = getActiveStudent();
      let calculatedSlots = calculateTimeSlots(activeStudent.gioVaoHoc || "12:30");

      const periodCards = calculatedSlots.map((slot, index) => {
        const card = document.createElement("div");
        card.className = "period-card";

        const metaBox = document.createElement("div");
        metaBox.className = "period-meta";

        const pName = document.createElement("span");
        pName.className = "p-name";
        pName.textContent = slot.label;

        const pTime = document.createElement("span");
        pTime.className = "p-time";
        pTime.textContent = slot.gio;

        metaBox.appendChild(pName);
        metaBox.appendChild(pTime);

        const badge = document.createElement("div");
        badge.className = "subject-badge";
        badge.tabIndex = 0;

        const handleSelect = () => {
          if (isEditMode) {
            openPicker(index, slot.label);
          }
        };

        badge.addEventListener("click", handleSelect);
        badge.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            handleSelect();
          }
        });

        card.appendChild(metaBox);
        card.appendChild(badge);
        listPeriods.appendChild(card);

        return {
          badge,
          update(subjectName) {
            badge.textContent = subjectName;
            badge.title = subjectName;
            badge.className = "subject-badge " + getSubjectColorClass(subjectName);
          },
          updateTime(timeString) {
            pTime.textContent = timeString;
          }
        };
      });

      function updateCalculatedScheduleTimes(timeStr) {
        calculatedSlots = calculateTimeSlots(timeStr);
        for (let i = 0; i < 5; i++) {
          periodCards[i].updateTime(calculatedSlots[i].gio);
        }
      }

      // ========================================================================
      // BẢNG CHỌN MÔN (CHO PHÉP XOÁ BẤT KỲ MÔN NÀO)
      // ========================================================================
      function buildPickerSheet() {
        sheetGrid.innerHTML = "";
        const std = getActiveStudent();
        const list = Array.isArray(std.monHocList) ? std.monHocList : DEFAULT_BASE_SUBJECTS;

        list.forEach(subName => {
          if (subName === "TRỐNG") return;

          const wrap = document.createElement("div");
          wrap.className = "custom-sub-item-wrap";

          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "btn-subject-item " + getSubjectColorClass(subName);
          btn.textContent = subName;
          btn.dataset.subName = subName;

          const delBadge = document.createElement("button");
          delBadge.type = "button";
          delBadge.className = "btn-del-sub-badge";
          delBadge.textContent = "×";
          delBadge.title = "Xoá môn " + subName;
          delBadge.dataset.delName = subName;

          wrap.appendChild(btn);
          wrap.appendChild(delBadge);
          sheetGrid.appendChild(wrap);
        });

        const emptyBtn = document.createElement("button");
        emptyBtn.type = "button";
        emptyBtn.className = "btn-subject-item sub-empty";
        emptyBtn.textContent = "TRỐNG";
        emptyBtn.dataset.subName = "TRỐNG";
        sheetGrid.appendChild(emptyBtn);
      }

      sheetGrid.addEventListener("click", (e) => {
        const delBtn = e.target.closest(".btn-del-sub-badge");
        if (delBtn) {
          e.stopPropagation();
          const targetSub = delBtn.dataset.delName;
          if (targetSub) deleteSubjectFromStudent(targetSub);
          return;
        }

        const subBtn = e.target.closest(".btn-subject-item");
        if (subBtn) {
          const targetSub = subBtn.dataset.subName;
          if (targetSub) applySubject(targetSub);
        }
      });

      function openPicker(index, label) {
        editTargetIndex = index;
        sheetTitle.textContent = label + " - " + (DAY_NAMES[String(currentDay)] || "");
        inpCustomSubject.value = "";
        modalPicker.classList.add("open");
        document.body.classList.add("scroll-locked");

        try {
          history.pushState({ modalOpen: true }, "");
        } catch (e) {}

        btnSheetClose.focus();
      }

      function closePicker(shouldTriggerBack = true) {
        if (!modalPicker.classList.contains("open")) return;
        modalPicker.classList.remove("open");

        if (!hasAnyModalOpen()) {
          document.body.classList.remove("scroll-locked");
        }

        if (shouldTriggerBack && history.state && history.state.modalOpen) {
          try {
            history.back();
          } catch (e) {}
        }

        if (editTargetIndex !== null && periodCards[editTargetIndex]) {
          periodCards[editTargetIndex].badge.focus();
        }
        editTargetIndex = null;
      }

      function applySubject(name) {
        if (editTargetIndex !== null) {
          const std = getActiveStudent();
          const dayKey = String(currentDay);
          if (!std.monHoc[dayKey]) std.monHoc[dayKey] = [];
          std.monHoc[dayKey][editTargetIndex] = name;
          silentSave();

          periodCards[editTargetIndex].update(name);
        }
        closePicker(true);
      }

      function handleAddCustomSubject() {
        const val = inpCustomSubject.value.replace(/\s+/g, ' ').trim().toUpperCase();
        if (!val) return;

        const std = getActiveStudent();
        if (!Array.isArray(std.monHocList)) std.monHocList = [...DEFAULT_BASE_SUBJECTS];
        if (!std.monHocList.includes(val)) {
          std.monHocList.push(val);
          silentSave();
          buildPickerSheet();
        }

        applySubject(val);
      }

      btnAddCustomSubject.addEventListener("click", handleAddCustomSubject);
      inpCustomSubject.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          handleAddCustomSubject();
        }
      });

      async function deleteSubjectFromStudent(subjectToDelete) {
        const msg = "Bạn có chắc chắn muốn xoá môn \"" + subjectToDelete + "\" không?\n\nKhi xoá môn này, tất cả các tiết có môn \"" + subjectToDelete + "\" ở tất cả các Thứ của học sinh này sẽ chuyển về TRỐNG.";
        const agreed = await showCustomConfirm("Xác Nhận Xoá Môn", msg, true);
        if (agreed) {
          const std = getActiveStudent();
          if (Array.isArray(std.monHocList)) {
            std.monHocList = std.monHocList.filter(item => item !== subjectToDelete);
          }

          for (let d = 2; d <= 7; d++) {
            const key = String(d);
            if (Array.isArray(std.monHoc[key])) {
              for (let i = 0; i < 5; i++) {
                if (std.monHoc[key][i] === subjectToDelete) {
                  std.monHoc[key][i] = "TRỐNG";
                }
              }
            }
          }

          silentSave();
          buildPickerSheet();
          render();
        }
      }

      // ========================================================================
      // QUẢN LÝ MENU HỌC SINH (CHỌN, ĐỔI TÊN, THÊM MỚI, XOÁ)
      // ========================================================================
      function renderUserDropdownList() {
        userListContainer.innerHTML = "";
        rootData.students.forEach(std => {
          const row = document.createElement("div");
          row.className = "user-item-row" + (std.id === rootData.activeId ? " active" : "");

          const title = document.createElement("div");
          title.className = "user-item-title";
          title.textContent = std.name;

          if (std.id === rootData.activeId) {
            const check = document.createElement("span");
            check.className = "user-item-check";
            check.textContent = "✓";
            title.prepend(check);
          }

          // Chạm vào tên: Đổi ngay sang học sinh đó và ĐÓNG NGAY CHẾ ĐỘ SỬA
          title.addEventListener("click", (e) => {
            e.stopPropagation();
            closeUserDropdown();
            switchActiveStudent(std.id, false); // false: Đóng ngay chế độ Sửa!
          });

          // Nút bánh răng ⚙️ mở menu cấu hình
          const gear = document.createElement("button");
          gear.type = "button";
          gear.className = "btn-user-gear";
          gear.textContent = "⚙️";
          gear.title = "Cấu hình " + std.name;

          gear.addEventListener("click", (e) => {
            e.stopPropagation();
            closeUserDropdown();
            openStudentActionSheet(std);
          });

          row.appendChild(title);
          row.appendChild(gear);
          userListContainer.appendChild(row);
        });
      }

      function openUserDropdown() {
        renderUserDropdownList();
        userDropdown.classList.add("open");
        btnUserToggle.setAttribute("aria-expanded", "true");
      }

      function closeUserDropdown() {
        userDropdown.classList.remove("open");
        btnUserToggle.setAttribute("aria-expanded", "false");
      }

      btnUserToggle.addEventListener("click", (e) => {
        e.stopPropagation();
        if (userDropdown.classList.contains("open")) {
          closeUserDropdown();
        } else {
          openUserDropdown();
        }
      });

      document.addEventListener("click", (e) => {
        if (!e.target.closest(".user-selector-wrap")) {
          closeUserDropdown();
        }
      });

      // CHUYỂN HỌC SINH: TỰ ĐỘNG LƯU VÀ ĐÓNG CHẾ ĐỘ SỬA NGAY LẬP TỨC
      function switchActiveStudent(newStudentId, enterEditModeNow = false) {
        if (rootData.activeId === newStudentId && !enterEditModeNow) return;

        // Tự động chốt lưu dữ liệu học sinh cũ
        if (isEditMode) {
          commitYear();
          commitStartTime();
          flushSaveNote();
        }

        rootData.activeId = newStudentId;
        silentSave();

        // NẾU BẤM TẠO MỚI -> BẬT CHẾ ĐỘ SỬA. NẾU CHUYỂN HỌC SINH -> ĐÓNG NGAY CHẾ ĐỘ SỬA!
        if (enterEditModeNow) {
          isEditMode = true;
        } else {
          isEditMode = false;
        }

        buildPickerSheet();
        render();
      }

      function openStudentActionSheet(std) {
        targetedStudentForAction = std;
        studentActionsTargetName.textContent = std.name;
        modalStudentActions.classList.add("open");
        document.body.classList.add("scroll-locked");
      }

      function closeStudentActionSheet() {
        modalStudentActions.classList.remove("open");
        if (!hasAnyModalOpen()) {
          document.body.classList.remove("scroll-locked");
        }
      }

      btnActCancel.addEventListener("click", closeStudentActionSheet);

      // Chuyển mượt sang Đổi tên
      btnActRename.addEventListener("click", () => {
        const std = targetedStudentForAction;
        modalStudentActions.classList.remove("open");
        if (std) {
          openNamePromptDialog("rename", std);
        }
      });

      // Chuyển mượt sang Xoá
      btnActDelete.addEventListener("click", async () => {
        const std = targetedStudentForAction;
        modalStudentActions.classList.remove("open");
        if (!std) return;

        const isOnlyOne = (rootData.students.length <= 1);
        const confirmMsgText = isOnlyOne
          ? "Bạn có chắc chắn muốn xoá học sinh \"" + std.name + "\" không?\n\nVì đây là học sinh cuối cùng, hệ thống sẽ xoá dữ liệu và đặt lại tên thành \"Học Sinh 1\" mặc định."
          : "Bạn có chắc chắn muốn xoá học sinh \"" + std.name + "\" không?\n\nToàn bộ thời khoá biểu của học sinh này sẽ bị xoá vĩnh viễn.";

        const agreed = await showCustomConfirm("Xác Nhận Xoá Học Sinh", confirmMsgText, true);
        if (agreed) {
          if (isOnlyOne) {
            const fresh = createDefaultStudentProfile(std.id, "Học Sinh 1");
            rootData.students = [fresh];
            rootData.activeId = fresh.id;
          } else {
            rootData.students = rootData.students.filter(s => s.id !== std.id);
            if (rootData.activeId === std.id) {
              rootData.activeId = rootData.students[0].id;
            }
          }

          // Đóng luôn chế độ Sửa sau khi xoá
          isEditMode = false;

          silentSave();
          buildPickerSheet();
          render();
        }
      });

      // ========================================================================
      // HỘP THOẠI NHẬP TÊN (THÊM MỚI / ĐỔI TÊN)
      // ========================================================================
      let promptMode = "create";
      let promptTargetStudent = null;

      function getNextDefaultStudentName() {
        let index = 1;
        while (rootData.students.some(s => s.name === "Học Sinh " + index)) {
          index++;
        }
        return "Học Sinh " + index;
      }

      function openNamePromptDialog(mode, std = null) {
        promptMode = mode;
        promptTargetStudent = std;
        promptErrorMsg.textContent = "";

        const defaultPlaceholder = getNextDefaultStudentName();

        if (mode === "create") {
          promptDialogTitle.textContent = "Thêm Học Sinh Mới";
          inpStudentName.value = "";
          inpStudentName.placeholder = defaultPlaceholder;
        } else {
          promptDialogTitle.textContent = "Đổi Tên Học Sinh";
          inpStudentName.value = std ? std.name : "";
          inpStudentName.placeholder = std ? std.name : defaultPlaceholder;
        }

        modalNamePrompt.classList.add("open");
        document.body.classList.add("scroll-locked");

        setTimeout(() => {
          inpStudentName.focus();
          inpStudentName.select();
        }, 50);
      }

      function closeNamePromptDialog() {
        modalNamePrompt.classList.remove("open");
        if (!hasAnyModalOpen()) {
          document.body.classList.remove("scroll-locked");
        }
      }

      btnCreateUserTrigger.addEventListener("click", () => {
        closeUserDropdown();
        openNamePromptDialog("create");
      });

      btnPromptCancel.addEventListener("click", closeNamePromptDialog);

      function handleSaveNamePrompt() {
        let typed = inpStudentName.value.replace(/\s+/g, ' ').trim();
        const placeholderName = inpStudentName.placeholder || getNextDefaultStudentName();

        if (!typed) {
          typed = placeholderName;
        }

        const isDuplicate = rootData.students.some(s => {
          if (promptMode === "rename" && promptTargetStudent && s.id === promptTargetStudent.id) {
            return false;
          }
          return s.name.toUpperCase() === typed.toUpperCase();
        });

        if (isDuplicate) {
          promptErrorMsg.textContent = "Tên này đã tồn tại, vui lòng chọn tên khác!";
          inpStudentName.focus();
          return;
        }

        closeNamePromptDialog();

        if (promptMode === "create") {
          // Tạo mới: TỰ ĐỘNG BẬT SẴN CHẾ ĐỘ SỬA
          const newStudent = createDefaultStudentProfile("std_" + Date.now(), typed);
          rootData.students.push(newStudent);
          switchActiveStudent(newStudent.id, true);
        } else if (promptMode === "rename" && promptTargetStudent) {
          promptTargetStudent.name = typed;
          silentSave();
          render();
        }
      }

      btnPromptSave.addEventListener("click", handleSaveNamePrompt);
      inpStudentName.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          handleSaveNamePrompt();
        }
      });

      // ========================================================================
      // POPUP XÁC NHẬN NỘI BỘ
      // ========================================================================
      function showCustomConfirm(title, message, isDanger = false) {
        return new Promise((resolve) => {
          confirmTitle.textContent = title;
          confirmMsg.textContent = message;
          btnConfirmOk.className = "btn-action " + (isDanger ? "btn-confirm-danger" : "btn-confirm-ok");
          modalConfirm.classList.add("open");
          document.body.classList.add("scroll-locked");

          const handleChoice = (ok) => {
            modalConfirm.classList.remove("open");
            if (!hasAnyModalOpen()) {
              document.body.classList.remove("scroll-locked");
            }
            btnConfirmOk.onclick = null;
            btnConfirmCancel.onclick = null;
            resolve(ok);
          };

          btnConfirmOk.onclick = () => handleChoice(true);
          btnConfirmCancel.onclick = () => handleChoice(false);
        });
      }

      // ========================================================================
      // RENDER VÀ ĐỒNG BỘ GIAO DIỆN
      // ========================================================================
      function render() {
        const std = getActiveStudent();

        lblActiveUserName.textContent = std.name;

        const m = std.thang || CURRENT_REAL_MONTH;
        const mFormatted = m < 10 ? "0" + m : String(m);
        viewMonth.textContent = mFormatted;
        selMonth.value = String(m);

        valYear.textContent = String(std.nam || CURRENT_REAL_YEAR);
        valYear.setAttribute("placeholder", String(std.nam || CURRENT_REAL_YEAR));

        const { h, min } = (function () {
          const parsed = parseTimeString(std.gioVaoHoc || "12:30");
          return { h: parsed.h, min: parsed.m };
        })();
        const formattedStart = (h < 10 ? "0" + h : h) + ":" + (min < 10 ? "0" + min : min);
        valStartTime.textContent = formattedStart;
        valStartTime.setAttribute("placeholder", formattedStart);

        txtDayNote.readOnly = !isEditMode;
        valYear.contentEditable = isEditMode ? "true" : "false";
        valStartTime.contentEditable = isEditMode ? "true" : "false";

        if (isEditMode) {
          btnEditToggle.className = "btn-action btn-done";
          btnEditToggle.textContent = "Xong";
          document.body.classList.add("edit-mode-active");
        } else {
          btnEditToggle.className = "btn-action btn-edit";
          btnEditToggle.textContent = "Sửa";
          document.body.classList.remove("edit-mode-active");
        }

        tabButtons.forEach(tab => {
          const val = Number(tab.getAttribute("data-day"));
          const isSelected = (val === currentDay);
          tab.classList.toggle("active-tab", isSelected);
          tab.setAttribute("aria-selected", isSelected ? "true" : "false");
        });

        const currentDayName = DAY_NAMES[String(currentDay)] || "Thứ Hai";
        dayNoteHeading.textContent = "Ghi chú " + currentDayName;

        updateCalculatedScheduleTimes(std.gioVaoHoc || "12:30");

        const dayList = (std.monHoc && std.monHoc[String(currentDay)]) || [];
        for (let i = 0; i < 5; i++) {
          periodCards[i].update((dayList[i] || "TRỐNG").trim());
        }

        txtDayNote.value = (std.ghiChuTheoThu && std.ghiChuTheoThu[String(currentDay)]) || "";
      }

      daysTabBar.addEventListener("click", (e) => {
        const btn = e.target.closest(".day-tab-btn");
        if (!btn) return;
        const val = Number(btn.getAttribute("data-day"));
        if (val !== currentDay) {
          if (isEditMode) {
            commitYear();
            commitStartTime();
            flushSaveNote();
          }
          currentDay = val;
          render();
        }
      });

      daysTabBar.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
          e.preventDefault();
          let delta = (e.key === "ArrowRight") ? 1 : -1;
          let nextDay = currentDay + delta;
          if (nextDay > 7) nextDay = 2;
          if (nextDay < 2) nextDay = 7;
          if (isEditMode) {
            commitYear();
            commitStartTime();
            flushSaveNote();
          }
          currentDay = nextDay;
          render();
          const targetTab = document.getElementById("tab-btn-" + nextDay);
          if (targetTab) targetTab.focus();
        }
      });

      btnEditToggle.addEventListener("click", () => {
        if (isToggling) return;
        isToggling = true;

        if (isEditMode) {
          commitYear();
          commitStartTime();
          flushSaveNote();
        }

        isEditMode = !isEditMode;

        if (!isEditMode) {
          if (document.activeElement && typeof document.activeElement.blur === "function") {
            document.activeElement.blur();
          }
        }
        render();

        setTimeout(() => {
          isToggling = false;
        }, 150);
      });

      selMonth.addEventListener("change", (e) => {
        const std = getActiveStudent();
        std.thang = Number(e.target.value);
        const mFormatted = std.thang < 10 ? "0" + std.thang : String(std.thang);
        viewMonth.textContent = mFormatted;
        silentSave();
      });

      function selectAllText(el) {
        setTimeout(() => {
          const range = document.createRange();
          range.selectNodeContents(el);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
        }, 50);
      }

      function sanitizePasteNumeric(e, allowColon = false) {
        e.preventDefault();
        const text = (e.clipboardData || window.clipboardData).getData("text/plain");
        const clean = allowColon ? text.replace(/[^\d:]/g, "") : text.replace(/\D/g, "");
        document.execCommand("insertText", false, clean);
      }

      valYear.addEventListener("paste", (e) => sanitizePasteNumeric(e, false));
      valStartTime.addEventListener("paste", (e) => sanitizePasteNumeric(e, true));

      function commitYear() {
        const std = getActiveStudent();
        let typed = valYear.textContent.replace(/\D/g, "").trim();
        let val = Number(typed);
        if (!val || val < 2020) val = CURRENT_REAL_YEAR;
        if (val > 2099) val = 2099;
        std.nam = val;
        valYear.textContent = String(val);
        valYear.setAttribute("placeholder", String(val));
        silentSave();
      }

      valYear.addEventListener("focus", function () {
        if (!isEditMode) return;
        selectAllText(this);
      });

      valYear.addEventListener("blur", commitYear);
      valYear.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          commitYear();
          valYear.blur();
        } else if (e.key === "Tab") {
          e.preventDefault();
          commitYear();
          valStartTime.focus();
        }
      });

      function commitStartTime() {
        const std = getActiveStudent();
        let typed = valStartTime.textContent.trim();
        const { h, m } = parseTimeString(typed);
        const cleanTime = (h < 10 ? "0" + h : h) + ":" + (m < 10 ? "0" + m : m);
        std.gioVaoHoc = cleanTime;
        valStartTime.textContent = cleanTime;
        valStartTime.setAttribute("placeholder", cleanTime);
        updateCalculatedScheduleTimes(cleanTime);
        silentSave();
      }

      valStartTime.addEventListener("focus", function () {
        if (!isEditMode) return;
        selectAllText(this);
      });

      valStartTime.addEventListener("blur", commitStartTime);
      valStartTime.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          commitStartTime();
          valStartTime.blur();
        }
      });

      txtDayNote.addEventListener("input", debouncedSaveNote);
      txtDayNote.addEventListener("change", flushSaveNote);
      txtDayNote.addEventListener("blur", flushSaveNote);

      btnSheetClose.addEventListener("click", () => closePicker(true));
      btnSheetCancel.addEventListener("click", () => closePicker(true));

      modalPicker.addEventListener("click", (e) => {
        if (e.target === modalPicker) closePicker(true);
      });

      btnReset.addEventListener("click", async () => {
        btnReset.disabled = true;
        const std = getActiveStudent();

        const agreed = await showCustomConfirm(
          "Đặt Lại Thời Khoá Biểu",
          "Bạn có chắc chắn muốn đặt lại thời khoá biểu của \"" + std.name + "\" về bản mẫu ban đầu không?\n\nTên học sinh \"" + std.name + "\" vẫn sẽ được giữ nguyên.",
          true
        );

        if (agreed) {
          std.nam = CURRENT_REAL_YEAR;
          std.thang = CURRENT_REAL_MONTH;
          std.gioVaoHoc = "12:30";
          std.monHoc = JSON.parse(JSON.stringify(SAMPLE_TIMETABLE));
          std.ghiChuTheoThu = { "2": "", "3": "", "4": "", "5": "", "6": "", "7": "" };
          std.monHocList = [...DEFAULT_BASE_SUBJECTS];

          silentSave();
          buildPickerSheet();
          render();
        }

        setTimeout(() => {
          btnReset.disabled = false;
        }, 300);
      });

      window.addEventListener("popstate", () => {
        if (modalConfirm.classList.contains("open")) {
          modalConfirm.classList.remove("open");
          return;
        }
        if (modalNamePrompt.classList.contains("open")) {
          closeNamePromptDialog();
          return;
        }
        if (modalStudentActions.classList.contains("open")) {
          closeStudentActionSheet();
          return;
        }
        if (modalPicker.classList.contains("open")) {
          closePicker(false);
        }
      });

      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (modalConfirm.classList.contains("open")) {
            modalConfirm.classList.remove("open");
            return;
          }
          if (modalNamePrompt.classList.contains("open")) {
            closeNamePromptDialog();
            return;
          }
          if (modalStudentActions.classList.contains("open")) {
            closeStudentActionSheet();
            return;
          }
          if (modalPicker.classList.contains("open")) {
            closePicker(true);
          }
          if (userDropdown.classList.contains("open")) {
            closeUserDropdown();
          }
        }
      });

      window.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") {
          flushSaveNote();
        }
      });
      window.addEventListener("beforeunload", flushSaveNote);

      buildPickerSheet();
      render();
    })();
  </script>
</body>
</html>
